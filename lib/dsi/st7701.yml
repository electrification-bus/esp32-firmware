# ST7701 480x640 IPS panel on the ESP32-P4's MIPI-DSI, one data lane, e.g. the Olimex
# MIPI-LCD2.8-640x480 V2 (WLK2802MIPI-15P-V2) on an ESP32-P4-DevKit's MIPI-DSI connector
# (doc/Peripherals.md). A peripheral: app code and features draw on it; it publishes no
# Homie node. ESP32-P4 only, and its frame buffer needs PSRAM.
#
#   peripherals:
#     - id: lcd
#       component: dsi/st7701
#       config: { rotation: 1 }
#
# config: rotation 0-3 (default 1, landscape 640x480); lane_mbps (default 500) and dpi_mhz
# (default 16), the figures of Olimex's Arduino demo for this panel.
peripheral:
  kind: display
generator:
  class: St7701
  header: dsi/st7701.h
  constructor: '("{id}", {config.rotation}, {config.lane_mbps}, {config.dpi_mhz})'
  config_defaults:
    rotation: 1
    lane_mbps: 500
    dpi_mhz: 16
  lib_deps:
    - adafruit/Adafruit BusIO @ 1.17.4
    - adafruit/Adafruit GFX Library @ 1.13.0
