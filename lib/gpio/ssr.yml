homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: ssr
    name: Solid State Relay
    type: gpio
    properties:
      - id: state
        name: State
        datatype: boolean
        settable: true
        retained: true
        value: false
        description: "The state of the relay (on/off)"
extensions: []
implementation: homie-esp32-sdk
# This component's entry in device.yml MUST include a config: block with `pin`
# (the relay's control GPIO) — the generator substitutes it straight into the C++
# constructor below, so a missing/omitted key breaks the generated build. Example:
#
#   - component: gpio/ssr
#     id: relay1
#     config:
#       pin: 15
generator:
  class: SSR
  header: gpio/ssr.h
  constructor: '("{id}", {config.pin})'
