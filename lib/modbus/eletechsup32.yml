homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: voltage-current-detector
    name: Modbus Eletechsup32
    type: modbus
    properties:
      - id: v-detect
        name: Voltage Detect
        datatype: boolean
        settable: false
        retained: true
        value: false
      - id: inputs
        name: Input States
        datatype: string
        settable: false
        retained: true
        value: ''
        description: "32-bit hex mask of input states, bit n = input n (e.g. 0x00000042)"
extensions: []
implementation: homie-esp32-sdk
# RS485 pins come from device.yml's top-level buses: block, shared by every modbus/*
# node (they are ONE physical bus — only the first node's setup() configures the UART).
# pin_a -> the RS485 module's "RXD" silk-screen pin, pin_b -> its "TXD" pin. Reference
# values by board are in doc/GPIOPins.md. Example:
#
#   buses:
#     rs485: { pin_a: 36, pin_b: 4 }
#   nodes:
#     - component: modbus/eletechsup32
#       id: voltage-current-detector
#       config:
#         address: 4
#
# config.address is REQUIRED: the Modbus slave address this node answers to, 1..247, and
# distinct per device on the bus. These modules ship as 4. There is no default here on
# purpose — the address is a fact about the wiring, so a bus with two of anything is
# described in device.yml rather than inherited from a component.
#
# Changing a unit's address is done on the unit, by whatever method its own datasheet
# gives — do it one at a time on an otherwise empty bus, since they all ship answering 4.
generator:
  class: Eletechsup32
  header: modbus/eletechsup32.h
  constructor: '("{id}", get_serial1(), {bus.rs485.pin_a}, {bus.rs485.pin_b}, {config.address})'
  # No lib_deps: modbus deps come from lib/platform/library.json (see sht20.yml).
