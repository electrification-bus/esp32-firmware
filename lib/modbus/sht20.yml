homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: environment_sht20
    name: SHT20 Modbus Temp/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: relative_humidity
        name: Humidity
        datatype: float
        unit: percent
        settable: false
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-sdk
# This component's entry in device.yml MUST include a config: block with
# pin_rs485_a/pin_rs485_b (A -> RS485 module's "RXD" silk screen pin, B -> its
# "TXD" pin) — the generator substitutes them straight into the C++ constructor
# below, so missing/omitted keys break the generated build. Example:
#
#   - component: modbus/sht20
#     id: environment_sht20
#     config:
#       pin_rs485_a: 36
#       pin_rs485_b: 4
#
# All modbus/* nodes share ONE physical RS485 bus, so every modbus node instance in
# device.yml must be given the SAME pin_rs485_a/pin_rs485_b — only the first node's
# setup() actually configures the UART; the rest are expected to match.
#
# Reference values by board:
#   esp32-poe-iso (Olimex, Ethernet):   pin_rs485_a: 36, pin_rs485_b: 4
#   esp32-s3-devkitc-1 / other boards:  pin_rs485_a: 6,  pin_rs485_b: 7
generator:
  class: Modbus_SHT20
  header: modbus/sht20.h
  constructor: '("{id}", get_serial1(), {config.pin_rs485_a}, {config.pin_rs485_b})'
  # PlatformIO libraries this component needs. `ebus-esp32 build/run/check/compiledb`
  # collects lib_deps from every component actually used in device.yml and writes a
  # lean, standalone build/platformio.ini (gitignored) — the active board's env
  # copied from platformio.ini, with [common].lib_deps pruned to drop any library
  # that's in some component's lib_deps catalog but not actually needed this build,
  # then extended with what IS needed. Without any modbus/* node in device.yml,
  # EspSoftwareSerial is never even listed, so it's never compiled or linked.
  lib_deps:
    - plerup/EspSoftwareSerial @ ^8.2.0
