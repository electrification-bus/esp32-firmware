homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: environment_sht20
    name: SHT20 Modbus Temp/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: relative_humidity
        name: Humidity
        datatype: float
        unit: percent
        settable: false
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-sdk
# RS485 pins come from device.yml's top-level buses: block, shared by every modbus/*
# node (they are ONE physical bus — only the first node's setup() configures the UART).
# pin_a -> the RS485 module's "RXD" silk-screen pin, pin_b -> its "TXD" pin. Reference
# values by board are in doc/GPIOPins.md. Example:
#
#   buses:
#     rs485: { pin_a: 36, pin_b: 4 }
#   nodes:
#     - component: modbus/sht20
#       id: environment_sht20
generator:
  class: Modbus_SHT20
  header: modbus/sht20.h
  constructor: '("{id}", get_serial1(), {bus.rs485.pin_a}, {bus.rs485.pin_b})'
  # No lib_deps here: modbus library dependencies (ModbusMaster, EspSoftwareSerial)
  # are declared in lib/platform/library.json — PlatformIO auto-installs them only
  # when a modbus/* component pulls in lib/platform via <platform/modbus/...>.
  # (Components whose deps aren't covered by a library.json list them under
  # generator.lib_deps and `ebus-esp32 generate` adds them to build/platformio.ini.)
