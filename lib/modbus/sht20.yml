homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: environment-sht20
    name: SHT20 Modbus Temp/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: relative-humidity
        name: Humidity
        datatype: float
        unit: "%"
        settable: false
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-firmware
# RS485 pins come from device.yml's top-level buses: block, shared by every modbus/*
# node (they are ONE physical bus — only the first node's setup() configures the UART).
# pin_a -> the RS485 module's "RXD" silk-screen pin, pin_b -> its "TXD" pin. Reference
# values by board are in doc/GPIOPins.md. Example:
#
#   buses:
#     rs485: { pin_a: 36, pin_b: 4 }
#   nodes:
#     - component: modbus/sht20
#       id: environment-sht20
#       config:
#         address: 1
#
# config.address is REQUIRED: the Modbus slave address this node answers to, 1..247, and
# distinct per device on the bus. These modules ship as 1. There is no default here on
# purpose — the address is a fact about the wiring, so a bus with two of anything is
# described in device.yml rather than inherited from a component.
#
# Changing a unit's address is done on the unit — holding register 0x0101, function code
# 0x06 on the XY-MD02 family — one at a time on an otherwise empty bus, since they all
# ship answering the same address.
generator:
  class: SHT20
  header: modbus/sht20.h
  constructor: '("{id}", get_serial1(), {bus.rs485.pin_a}, {bus.rs485.pin_b}, {config.address})'
  # No lib_deps here: modbus library dependencies (ModbusMaster, EspSoftwareSerial)
  # are declared in lib/platform/library.json — PlatformIO auto-installs them only
  # when a modbus/* component pulls in lib/platform via <platform/modbus/...>.
  # (Components whose deps aren't covered by a library.json list them under
  # generator.lib_deps and `ebus-esp32 generate` adds them to build/platformio.ini.)
