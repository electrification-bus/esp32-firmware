homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: environment_sht20
    name: SHT20 Modbus Temp/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: relative_humidity
        name: Humidity
        datatype: float
        unit: percent
        settable: true
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-sdk
generator:
  class: Modbus_SHT20
  header: modbus/sht20.h
  constructor: '("{id}", get_serial1())'

esphome:
  platform: modbus_controller
  bus: modbus
  config:
    address: 0x01
  properties:
    temperature:
      register_type: read
      address: 1
      value_type: U_WORD
      filters:
        - multiply: 0.1
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
    relative_humidity:
      register_type: read
      address: 2
      value_type: U_WORD
      filters:
        - multiply: 0.1
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
