homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: energy_meter
    name: 6-CT Energy Meter
    type: energy
    properties:
      - id: voltage
        name: Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 0.0
      - id: frequency
        name: Frequency
        datatype: float
        unit: Hz
        settable: false
        retained: true
        value: 0.0
      - id: temperature
        name: Board Temperature
        datatype: float
        unit: °C
        settable: false
        retained: true
        value: 0.0
      - id: current_ct1
        name: Current CT1
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 0.0
      - id: power_ct1
        name: Real Power CT1
        datatype: float
        unit: W
        settable: false
        retained: true
        value: 0.0
      - id: va_ct1
        name: Apparent Power CT1
        datatype: float
        unit: VA
        settable: false
        retained: true
        value: 0.0
      - id: pf_ct1
        name: Power Factor CT1
        datatype: float
        unit: ''
        settable: false
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-sdk
# SPI bus pins come from device.yml's top-level buses: block, shared by every spi/*
# node. The per-node config: holds the two chip-selects (one per ATM90E32 IC:
# CS1 -> IC1/CTs 1-3, CS2 -> IC2/CTs 4-6; board silkscreen "CS"/"CS2"). Example:
#
#   buses:
#     spi: { pin_sck: 14, pin_miso: 12, pin_mosi: 13 }
#   nodes:
#     - component: spi/atm90e32_energy_meter
#       id: energy_meter
#       config:
#         pin_cs1: 15
#         pin_cs2: 16
#
# Reference pins by board are in doc/GPIOPins.md. For multi-board (stacked) setups,
# additional boards need their own pin_cs1/pin_cs2 node instances — see
# doc/GenerateHomieDevice.md for multi-instance components.
generator:
  class: EnergyMeter
  header: spi/atm90e32_energy_meter.h
  constructor: '("{id}", {bus.spi.pin_sck}, {bus.spi.pin_miso}, {bus.spi.pin_mosi}, {config.pin_cs1}, {config.pin_cs2})'
  lib_deps:
    - https://github.com/CircuitSetup/ATM90E32.git
