extensions: []
# SPI bus pins come from device.yml's top-level buses: block, shared by every spi/*
# node. The per-node config: holds the two chip-selects (one per ATM90E32 IC:
# CS1 -> IC1/CTs 1-3, CS2 -> IC2/CTs 4-6; board silkscreen "CS"/"CS2"). Example:
#
#   buses:
#     spi: { pin_sck: 14, pin_miso: 12, pin_mosi: 13 }
#   nodes:
#     - component: spi/atm90e32_energy_meter
#       id: energy-meter
#       config:
#         pin_cs1: 15
#         pin_cs2: 16
#
# Reference pins by board are in doc/GPIOPins.md. For multi-board (stacked) setups,
# additional boards need their own pin_cs1/pin_cs2 node instances — see
# doc/GenerateHomieDevice.md for multi-instance components.
#
# Calibration (line frequency, PGA gain, voltage and current gains) is not a config:
# key. Generated devices use EnergyMeter::DEFAULT_CALIBRATION (60 Hz, 1x); a hand-coded
# device passes an EnergyMeter::Calibration as a seventh constructor argument. The
# values in effect are logged at setup.
generator:
  class: EnergyMeter
  header: spi/atm90e32_energy_meter.h
  constructor: '("{id}", {bus.spi.pin_sck}, {bus.spi.pin_miso}, {bus.spi.pin_mosi}, {config.pin_cs1}, {config.pin_cs2})'
  lib_deps:
    # Pinned: upstream master is a V2 that adds a Preferences (NVS) dependency.
    - https://github.com/CircuitSetup/ATM90E32.git#467858f48b1ef5610f489218bdb153b2df8556d6
