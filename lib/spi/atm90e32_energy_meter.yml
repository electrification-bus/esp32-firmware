homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: meter_volts
    name: Voltage Sensor
    type: energy
    properties:
      - id: volts
        name: Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 0.0
  - id: meter_current
    name: Current Sensor
    type: energy
    properties:
      - id: amps
        name: Current
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 0.0
  - id: meter_watts
    name: Power Sensor
    type: energy
    properties:
      - id: watts
        name: Power
        datatype: float
        unit: W
        settable: false
        retained: true
        value: 0.0
  - id: meter_kwh
    name: Energy Consumption
    type: energy
    properties:
      - id: kwh
        name: Energy
        datatype: float
        unit: kWh
        settable: false
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-sdk
generator:
  class: EnergyMeter
  header: spi/atm90e32_energy_meter.h
  constructor: '("{id}", {config.cs1_pin}, {config.cs2_pin})'

esphome:
  platform: atm90e32
  bus: spi
  config:
    cs_pin: "{config.cs1_pin}"
    line_frequency: 60Hz
    current_phases: 3
    update_interval: 10s
  properties:
    volts:
      path: [phase_a, voltage]
    amps:
      path: [phase_a, current]
    watts:
      path: [phase_a, power]
    kwh:
      path: [phase_a, forward_active_energy]
