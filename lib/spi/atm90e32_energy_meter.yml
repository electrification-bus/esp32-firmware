homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: energy_meter
    name: 6-CT Energy Meter
    type: energy
    properties:
      - id: voltage
        name: Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 0.0
      - id: frequency
        name: Frequency
        datatype: float
        unit: Hz
        settable: false
        retained: true
        value: 0.0
      - id: temperature
        name: Board Temperature
        datatype: float
        unit: °C
        settable: false
        retained: true
        value: 0.0
      - id: current_ct1
        name: Current CT1
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 0.0
      - id: power_ct1
        name: Real Power CT1
        datatype: float
        unit: W
        settable: false
        retained: true
        value: 0.0
      - id: va_ct1
        name: Apparent Power CT1
        datatype: float
        unit: VA
        settable: false
        retained: true
        value: 0.0
      - id: pf_ct1
        name: Power Factor CT1
        datatype: float
        unit: ""
        settable: false
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-sdk
generator:
  class: EnergyMeter
  header: spi/atm90e32_energy_meter.h
  constructor: '("{id}", {config.cs1_pin}, {config.cs2_pin})'
