# ILI9341 320x240 TFT display on the shared SPI bus (doc/Peripherals.md). A peripheral:
# app code and features draw on it; it publishes no Homie node.
#
#   buses:
#     spi: { pin_sck: 14, pin_mosi: 2 }      # pin_miso optional: the panel is write-only
#   peripherals:
#     - id: lcd
#       component: spi/ili9341
#       config: { pin_cs: 5, pin_dc: 15 }    # Olimex MOD-LCD2.8RTP on an ESP32-POE-ISO UEXT
#
# config: pin_cs, pin_dc; rotation 0-3 (default 1, landscape); spi_hz (default 40 MHz,
# Olimex's figure; 30 MHz for a long cable).
peripheral:
  kind: display
generator:
  class: Ili9341
  header: spi/ili9341.h
  constructor: '("{id}", {bus.spi.pin_sck}, {bus.spi.pin_miso|-1}, {bus.spi.pin_mosi}, {config.pin_cs}, {config.pin_dc}, {config.rotation}, {config.spi_hz})'
  config_defaults:
    rotation: 1
    spi_hz: 40000000
  lib_deps:
    - adafruit/Adafruit BusIO @ 1.17.4
    - adafruit/Adafruit GFX Library @ 1.13.0
    - adafruit/Adafruit ILI9341 @ 1.7.0
