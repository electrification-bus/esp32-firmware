homie: 5.0.1
name: MY_DEVICE
type: ebus
state: init
nodes:
  - id: battery_bms
    name: JBD Smart BMS
    type: battery
    properties:
      - id: voltage
        name: Pack Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 0.0
      - id: current
        name: Current
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 0.0
      - id: soc
        name: State of Charge
        datatype: integer
        unit: "%"
        format: "0:100"
        settable: false
        retained: true
        value: 0
      - id: remain_capacity
        name: Remaining Capacity
        datatype: float
        unit: Ah
        settable: false
        retained: true
        value: 0.0
      - id: nominal_capacity
        name: Nominal Capacity
        datatype: float
        unit: Ah
        settable: false
        retained: true
        value: 0.0
      - id: cycles
        name: Charge Cycles
        datatype: integer
        settable: false
        retained: true
        value: 0
      - id: mosfet_charge
        name: Charge MOSFET
        datatype: boolean
        settable: true
        retained: true
        value: false
      - id: mosfet_discharge
        name: Discharge MOSFET
        datatype: boolean
        settable: false
        retained: true
        value: false
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: cell_voltages
        name: Cell Voltages
        datatype: string
        settable: false
        retained: true
        value: ""
        description: "Comma-separated cell voltages in V"
      - id: charge_control
        name: Charge Control
        datatype: boolean
        settable: true
        retained: true
        value: false
      - id: rescan
        name: Rescan BLE
        datatype: boolean
        settable: true
        retained: false
        value: false
        description: "Set true to clear saved BMS address and scan for a new device"
      - id: charge_threshold_low
        name: Low SOC Threshold
        datatype: integer
        unit: "%"
        value: 22
        settable: true
        retained: true
        description: "SOC percentage below which charging will be enabled"
      - id: charge_threshold_high
        name: High SOC Threshold
        datatype: integer
        unit: "%"
        value: 88
        settable: true
        retained: true
        description: "SOC percentage above which charging will be disabled"
      - id: peak_begin_min
        name: Peak Window Start (minutes-of-day)
        datatype: integer
        value: 955
        settable: true
        retained: true
        description: "Peak window start in minutes-of-day (e.g. 955 = 15:55)"
      - id: peak_end_min
        name: Peak Window End (minutes-of-day)
        datatype: integer
        value: 1265
        settable: true
        retained: true
        description: "Peak window end in minutes-of-day (e.g. 1265 = 21:05)"
      - id: threshold_discharge_daily
        name: Threshold Discharge Daily
        datatype: boolean
        value: false
        settable: true
        retained: true
        description: "When true, discharge to low SOC threshold before charging at off-peak start"
extensions: []
implementation: homie-esp32-sdk
