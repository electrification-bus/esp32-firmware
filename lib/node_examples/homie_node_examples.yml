homie: 5.0.1
name: MY_DEVICE
type: ebus
state: init
nodes:
# --- relay1: GPIO solid state relay, settable on/off ---
  - id: relay1
    name: Solid State Relay
    type: gpio
    properties:
      - id: pin
        name: GPIO Pin
        datatype: integer
        value: 9
        settable: false
        retained: false
        description: "GPIO pin number connected to the SSR control input"
      - id: state
        name: State
        datatype: boolean
        settable: true
        retained: true
        value: false
        description: "The state of the relay (on/off)"

# --- cellular_modem: GPIO AT-command cellular modem (SMS) ---
  - id: cellular_modem
    name: Cellular Modem
    type: modem
    properties:
      - id: send_sms
        name: Send SMS
        datatype: string
        settable: true
        retained: false
        value: ""
        description: "Send an SMS message; format: <number>:<message>"
      - id: status
        name: Modem Status
        datatype: string
        settable: false
        retained: true
        value: "unknown"

# --- environment_bme280: I2C BME280 temp/pressure/humidity sensor ---
  - id: environment_bme280
    name: BME280 Temp/Pressure/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: air_pressure
        name: Air Pressure
        datatype: float
        unit: mb
        settable: false
        retained: true
        value: 0.0
      - id: relative_humidity
        name: Humidity
        datatype: float
        unit: percent
        settable: false
        retained: true
        value: 0.0

# --- environment_sht20: Modbus RS485 SHT20 temp/humidity sensor ---
  - id: environment_sht20
    name: SHT20 Modbus Temp/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: relative_humidity
        name: Humidity
        datatype: float
        unit: percent
        settable: false
        retained: true
        value: 0.0

# --- voltage_current_detector: Modbus Eletechsup32 32-input discrete module ---
  - id: voltage_current_detector
    name: Modbus Eletechsup32
    type: modbus
    properties:
      - id: V_detect
        name: Voltage Detect
        datatype: boolean
        settable: false
        retained: true
        value: false
      - id: I_detect
        name: Current Detect
        datatype: boolean
        settable: false
        retained: true
        value: false

# --- meter_*: CircuitSetup ATM90E32 SPI polyphase energy meter ---
  - id: meter_volts
    name: Voltage Sensor
    type: energy
    properties:
      - id: volts
        name: Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 0.0
  - id: meter_current
    name: Current Sensor
    type: energy
    properties:
      - id: amps
        name: Current
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 0.0
  - id: meter_watts
    name: Power Sensor
    type: energy
    properties:
      - id: watts
        name: Power
        datatype: float
        unit: W
        settable: false
        retained: true
        value: 0.0
  - id: meter_kwh
    name: Energy Consumption
    type: energy
    properties:
      - id: kwh
        name: Energy
        datatype: float
        unit: kWh
        settable: false
        retained: true
        value: 0.0

# --- battery_bms: JBD Smart BMS via BLE, pack monitoring + charge control ---
  - id: battery_bms
    name: JBD Smart BMS
    type: battery
    properties:
      - id: voltage
        name: Pack Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 0.0
      - id: current
        name: Current
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 0.0
      - id: soc
        name: State of Charge
        datatype: integer
        unit: "%"
        format: "0:100"
        settable: false
        retained: true
        value: 0
      - id: remain_capacity
        name: Remaining Capacity
        datatype: float
        unit: Ah
        settable: false
        retained: true
        value: 0.0
      - id: nominal_capacity
        name: Nominal Capacity
        datatype: float
        unit: Ah
        settable: false
        retained: true
        value: 0.0
      - id: cycles
        name: Charge Cycles
        datatype: integer
        settable: false
        retained: true
        value: 0
      - id: mosfet_charge
        name: Charge MOSFET
        datatype: boolean
        settable: true
        retained: true
        value: false
      - id: mosfet_discharge
        name: Discharge MOSFET
        datatype: boolean
        settable: false
        retained: true
        value: false
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: cell_voltages
        name: Cell Voltages
        datatype: string
        settable: false
        retained: true
        value: ""
        description: "Comma-separated cell voltages in V"
      - id: charge_control
        name: Charge Control
        datatype: boolean
        settable: true
        retained: true
        value: false
      - id: rescan
        name: Rescan BLE
        datatype: boolean
        settable: true
        retained: false
        value: false
        description: "Set true to clear saved BMS address and scan for a new device"
      - id: charge_threshold_low
        name: Low SOC Threshold
        datatype: integer
        unit: "%"
        value: 22
        settable: true
        retained: true
        description: "SOC percentage below which charging will be enabled"
      - id: charge_threshold_high
        name: High SOC Threshold
        datatype: integer
        unit: "%"
        value: 88
        settable: true
        retained: true
        description: "SOC percentage above which charging will be disabled"
      - id: peak_begin_min
        name: Peak Window Start (minutes-of-day)
        datatype: integer
        value: 955
        settable: true
        retained: true
        description: "Peak window start in minutes-of-day (e.g. 955 = 15:55)"
      - id: peak_end_min
        name: Peak Window End (minutes-of-day)
        datatype: integer
        value: 1265
        settable: true
        retained: true
        description: "Peak window end in minutes-of-day (e.g. 1265 = 21:05)"
      - id: threshold_discharge_daily
        name: Threshold Discharge Daily
        datatype: boolean
        value: false
        settable: true
        retained: true
        description: "When true, discharge to low SOC threshold before charging at off-peak start"

# --- ota: Over-the-air firmware update management ---
  - id: ota
    name: OTA Update
    type: ota
    properties:
      - id: enabled
        name: OTA Enabled
        datatype: boolean
        settable: true
        retained: true
        value: true
      - id: state
        name: Update State
        datatype: enum
        format: "idle,downloading,verifying,updating,rebooting,error"
        settable: false
        retained: true
        value: idle
      - id: progress
        name: Progress
        datatype: integer
        unit: "%"
        format: "0:100"
        settable: false
        retained: true
        value: 0
      - id: version
        name: Firmware Version
        datatype: string
        settable: false
        retained: true
        value: "1.0.0"
      - id: firmware-url
        name: Firmware URL
        datatype: string
        settable: true
        retained: false
        value: ""
      - id: checksum
        name: Firmware Checksum
        datatype: string
        settable: true
        retained: false
        value: ""
      - id: message
        name: Status Message
        datatype: string
        settable: false
        retained: true
        value: "Ready"

extensions: []
implementation: homie-esp32-sdk
