homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: environment_bme280
    name: BME280 Temp/Pressure/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: air_pressure
        name: Air Pressure
        datatype: float
        unit: mb
        settable: false
        retained: true
        value: 0.0
      - id: relative_humidity
        name: Humidity
        datatype: float
        unit: percent
        settable: false
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-sdk
generator:
  class: BME280
  header: i2c/bme280.h
  constructor: '("{id}")'

esphome:
  platform: bme280_i2c
  bus: i2c
  config:
    address: 0x76
    update_interval: 10s
  properties:
    temperature:
      key: temperature
      device_class: temperature
      state_class: measurement
    air_pressure:
      key: pressure
      device_class: atmospheric_pressure
      state_class: measurement
    relative_humidity:
      key: humidity
      device_class: humidity
      state_class: measurement
