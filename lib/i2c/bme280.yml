homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: environment_bme280
    name: BME280 Temp/Pressure/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: air_pressure
        name: Air Pressure
        datatype: float
        unit: mb
        settable: false
        retained: true
        value: 0.0
      - id: relative_humidity
        name: Humidity
        datatype: float
        unit: percent
        settable: false
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-sdk
# This component's entry in device.yml MUST include a config: block with
# pin_sda/pin_scl (I2C bus pins) — the generator substitutes them straight into
# the C++ constructor below, so missing/omitted keys break the generated build.
# Example:
#
#   - component: i2c/bme280
#     id: environment_bme280
#     config:
#       pin_sda: 13
#       pin_scl: 16
#
# Reference values by board (WROVER boards must move SCL off GPIO 16/17 — PSRAM
# uses those pins):
#   esp32-poe-iso / esp32-s3-devkitc-1: pin_sda: 13, pin_scl: 16
#   esp32-poe-iso-wrover:               pin_sda: 13, pin_scl: 14
generator:
  class: BME280
  header: i2c/bme280.h
  constructor: '("{id}", {config.pin_sda}, {config.pin_scl})'
  lib_deps:
    - https://github.com/adafruit/Adafruit_BME280_Library.git
