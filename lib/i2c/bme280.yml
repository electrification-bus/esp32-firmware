homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: environment-bme280
    name: BME280 Temp/Pressure/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: air-pressure
        name: Air Pressure
        datatype: float
        unit: mb
        settable: false
        retained: true
        value: 0.0
      - id: relative-humidity
        name: Humidity
        datatype: float
        unit: "%"
        settable: false
        retained: true
        value: 0.0
extensions: []
implementation: homie-esp32-sdk
# I2C pins come from device.yml's top-level buses: block, shared by every i2c/* node.
# The only per-node config is the sensor's I2C address: 0x76 (SDO low, the usual
# breakout default) or 0x77 (SDO high). Example:
#
#   buses:
#     i2c: { pin_sda: 13, pin_scl: 16 }
#   nodes:
#     - component: i2c/bme280
#       id: environment-bme280
#       config:
#         address: 0x76
#
# Reference pins by board are in doc/GPIOPins.md (WROVER boards must move SCL off
# GPIO 16/17 — PSRAM uses those pins).
generator:
  class: BME280
  header: i2c/bme280.h
  constructor: '("{id}", {bus.i2c.pin_sda}, {bus.i2c.pin_scl}, {config.address})'
  lib_deps:
    - https://github.com/adafruit/Adafruit_BME280_Library.git
