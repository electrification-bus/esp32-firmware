homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: display-gme12864
    name: GME12864 OLED Display
    type: display
    properties:
      - id: one-line
        name: One Line
        datatype: string
        settable: true
        retained: true
        description: "Fill the screen with this text on one line, in the largest font it fits (~6 chars big, up to 25 small). Empty when another layout, or nothing, is showing."
      - id: two-line
        name: Two Lines
        datatype: string
        settable: true
        retained: true
        description: "Show this text on two lines, in the largest font it fits (~9 chars each big, up to 25 small). Break with '|' or a newline, otherwise it word-wraps. Empty when not showing."
      - id: three-line
        name: Three Lines
        datatype: string
        settable: true
        retained: true
        description: "Show this text on three lines, in the largest font it fits (12 chars each, up to 25 small). Break with '|' or a newline, otherwise it word-wraps. Empty when not showing."
      # Per-line alternative to the layouts above: each sets ONE line of the three-line
      # grid and leaves the other two as they are.
      - id: line-one
        name: Line One
        datatype: string
        settable: true
        retained: true
        description: "Text on line 1 of the three-line grid. Lines 2 and 3 keep what they were showing. A '|' or newline becomes a space. Empty when a whole-screen layout, or nothing, is showing."
      - id: line-two
        name: Line Two
        datatype: string
        settable: true
        retained: true
        description: "Text on line 2 of the three-line grid. Lines 1 and 3 keep what they were showing. A '|' or newline becomes a space. Empty when a whole-screen layout, or nothing, is showing."
      - id: line-three
        name: Line Three
        datatype: string
        settable: true
        retained: true
        description: "Text on line 3 of the three-line grid. Lines 1 and 2 keep what they were showing. A '|' or newline becomes a space. Empty when a whole-screen layout, or nothing, is showing."
extensions: []
implementation: homie-esp32-sdk
# 0.96" 128x64 SSD1306 OLED. I2C pins come from device.yml's top-level buses: block,
# shared by every i2c/* node; the only per-node config is the address — 0x3C on these
# modules (0x3D if the address jumper is moved). Example:
#
#   buses:
#     i2c: { pin_sda: 13, pin_scl: 16 }
#   nodes:
#     - component: i2c/gme12864
#       id: display-gme12864
#       config:
#         address: 0x3C
#
# Driving it: publish text to <node>/one-line/set, two-line/set or three-line/set for a
# whole-screen layout, or to <node>/line-one/set, line-two/set or line-three/set to set
# one line of the three-line grid and leave the others alone — or call
# deliver_local_set() on the same <node>/<property> from another component. Firmware code
# can also write single lines with text(text, line_num, font_size); see gme12864.h.
# It shows a splash ("eBus" over the node id) until the first write.
generator:
  class: GME12864
  header: i2c/gme12864.h
  constructor: '("{id}", {bus.i2c.pin_sda}, {bus.i2c.pin_scl}, {config.address})'
  lib_deps:
    - olikraus/U8g2 @ ^2.35.0
