homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: ota
    name: OTA Update
    type: ota
    properties:
      - id: enabled
        name: OTA Enabled
        datatype: boolean
        settable: true
        retained: true
        value: true
      - id: state
        name: Update State
        datatype: enum
        format: "idle,downloading,verifying,updating,rebooting,error"
        settable: false
        retained: true
        value: idle
      - id: progress
        name: Progress
        datatype: integer
        unit: "%"
        format: "0:100"
        settable: false
        retained: true
        value: 0
      - id: version
        name: Firmware Version
        datatype: string
        settable: false
        retained: true
        value: "1.0.0"
      - id: firmware-url
        name: Firmware URL
        datatype: string
        settable: true
        retained: false
        value: ""
      - id: checksum
        name: Firmware Checksum
        datatype: string
        settable: true
        retained: false
        value: ""
      - id: message
        name: Status Message
        datatype: string
        settable: false
        retained: true
        value: "Ready"
extensions: []
implementation: homie-esp32-sdk
