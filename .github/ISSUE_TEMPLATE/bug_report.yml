name: Bug report
description: Report firmware or ./ebus-esp32 behavior that is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities privately as described in SECURITY.md, not here.
  - type: input
    id: board
    attributes:
      label: Board
      placeholder: Olimex ESP32-POE-ISO
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: PlatformIO environment
      description: "`device.environment` in device.yml; `./ebus-esp32 envs` lists them."
      placeholder: esp32-poe-iso
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: "`device.firmware_version` from device.yml and the commit you built (`git rev-parse --short HEAD`)."
      placeholder: 1.0.0 at 93a0861
    validations:
      required: true
  - type: textarea
    id: device-yml
    attributes:
      label: device.yml excerpt
      description: The nodes and buses involved. Remove Wi-Fi and MQTT passwords and the device passphrase.
      render: yaml
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Serial or network console output (`./ebus-esp32 monitor`), or the failing `./ebus-esp32` command's output.
      render: text
