name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli-tests:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test requirements
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest -q

  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      # One `pio test` per suite; see cmd_test in ebus-esp32 for why.
      - name: Run tests
        run: ./ebus-esp32 test

  # lib/ebus_core is a submodule of electrification-bus/cpp-sdk, whose own CI builds the
  # core with GCC and Clang and runs the POSIX port. Here, only check that the pinned
  # commit is a cpp-sdk release tag.
  core-pin:
    name: Core submodule is at a cpp-sdk tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the pinned commit
        run: |
          sha=$(git rev-parse HEAD:lib/ebus_core)
          url=$(git config -f .gitmodules submodule.lib/ebus_core.url)
          tag=$(git ls-remote --tags "$url" | awk -v s="$sha" '$1 == s { sub("refs/tags/", "", $2); sub("\\^\\{\\}", "", $2); print $2 }' | head -n 1)
          if [ -z "$tag" ]; then
            echo "::error::lib/ebus_core is at $sha, which is not a tag in $url"
            exit 1
          fi
          echo "lib/ebus_core is at cpp-sdk $tag ($sha)"

  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32-poe-iso
          - esp32-poe-iso-arduino2
          - esp32-s3-devkitc-1
          - esp32-s3-devkitc-1-arduino2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # penv/ is a virtualenv bound to this runner's Python; a restored copy on a
          # newer runner image points at an interpreter that is gone.
          path: |
            ~/.platformio
            !~/.platformio/penv
          key: pio-v2-${{ matrix.env }}-${{ hashFiles('platformio/platformio.ini', 'lib/*/library.json', 'lib/*/*.yml') }}
          restore-keys: pio-v2-${{ matrix.env }}-

      - name: Install PlatformIO and PyYAML
        run: pip install platformio pyyaml

      # examples/demo names one environment; build each matrix env from a copy of it, as a
      # project outside the repo. The overlay gives the image a throwaway admin passphrase
      # so no secret is needed.
      - name: Prepare the project
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          sed "s/^  environment: .*/  environment: ${{ matrix.env }}/" examples/demo/device.yml > "$RUNNER_TEMP/demo/device.yml"
          grep -q "^  environment: ${{ matrix.env }}$" "$RUNNER_TEMP/demo/device.yml"
          printf 'device:\n  device_passphrase: "%s"\n' "$(openssl rand -hex 16)" > "$RUNNER_TEMP/demo/config-overlay.yml"

      - name: Generate
        run: ./ebus-esp32 generate "$RUNNER_TEMP/demo"

      - name: Build
        run: ./ebus-esp32 build "$RUNNER_TEMP/demo"

  # Every example project builds as it stands, in its own environment. (examples/demo is
  # built for every environment above; examples/bms needs its driver copied into lib/.)
  example:
    name: examples/${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - bridge-bess
          - sht20
          - ssr
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the example's environment
        id: env
        run: |
          echo "name=$(sed -n 's/^  environment: *\([^ #]*\).*/\1/p' examples/${{ matrix.example }}/device.yml)" >> "$GITHUB_OUTPUT"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            !~/.platformio/penv
          key: pio-v2-${{ steps.env.outputs.name }}-${{ hashFiles('platformio/platformio.ini', 'lib/*/library.json', 'lib/*/*.yml') }}
          restore-keys: pio-v2-${{ steps.env.outputs.name }}-

      - name: Install PlatformIO and PyYAML
        run: pip install platformio pyyaml

      - name: Prepare the project
        run: |
          cp -R examples/${{ matrix.example }} "$RUNNER_TEMP/project"
          printf 'device:\n  device_passphrase: "%s"\n' "$(openssl rand -hex 16)" > "$RUNNER_TEMP/project/config-overlay.yml"

      - name: Build
        run: ./ebus-esp32 build "$RUNNER_TEMP/project"
