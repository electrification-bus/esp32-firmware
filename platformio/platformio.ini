; PlatformIO Project Configuration File
;
; NOT AT THE REPO ROOT, DELIBERATELY. A root platformio.ini makes the VSCode PlatformIO
; extension adopt this folder as its project and run `pio` in the background against
; THIS file — which never lists a component's generator.lib_deps. It would then see the
; libraries ./ebus-esp32 installed (Adafruit_BME280, ATM90E32, ...) as unused and prune
; them mid-build, wiping .pio and failing the build with "opening dependency file ...
; No such file or directory".
;
; Moving it here is only half the fix — the extension remembers this folder and writes a
; stub platformio.ini back at the root within a minute, so it can revive at any time.
; The other half is in ebus-esp32: generated builds set [platformio] build_dir and
; libdeps_dir to .pio/cli, so the CLI and the extension never share a file.
;
; Everything reads this path explicitly: ./ebus-esp32 generates build/platformio.ini
; from it and passes `pio run -c`. Raw `pio` needs `-c platformio/platformio.ini` too.
; platformio_local.ini stays at the REPO ROOT — extra_configs below resolves against
; the project dir, not against this file.
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;The three POE-ISO envs:

;Env	               Flash    PSRAM	Module
;esp32-poe-iso	         4MB	no	    WROOM-32E
;esp32-poe-iso-16mb	    16MB	no	    WROOM-32E
;esp32-poe-iso-wrover	4MB	8MB	    WROVER-E

[platformio]
; Merge in personal overrides from a gitignored local file. Values in
; platformio_local.ini take precedence over anything below. The file is
; optional — PIO ignores a missing extra_configs path.
; See platformio_local.ini.example for a documented template; copy it to
; platformio_local.ini and edit (or leave it absent if no overrides needed).
extra_configs = platformio_local.ini

[env]
; Drop the framework's default -std=gnu++11 so our -std=gnu++17 (in [common].build_flags)
; wins. build_unflags MUST live here in [env] (auto-applied to all environments) — in
; [common] it is inert, because envs only inherit ${common.build_flags}, not its
; build_unflags. C++17 is needed for the D2 declarative descriptor structs.
build_unflags = -std=gnu++11

; Console tee: force-include platform/log_stream.h into every file under src/ so its
; `#define Serial logStream` redirects all existing Serial.printf() call sites to the
; UART + TCP tee (see include/platform/log_stream.h). build_src_flags — NOT build_flags —
; is essential: it applies only to src/, leaving the Arduino core and .pio/libdeps
; libraries compiling against the core's own `Serial`. Components under lib/ opt in via
; the #include in include/node/NodeEntity.h. Delete this line to revert to plain Serial.
build_src_flags = -include platform/log_stream.h

; generate_homie.py regenerates src/homie.cpp + data/*.yml from device.yml before
; every build, so device.yml is the single source of truth (the generated files are
; gitignored). Listed first so the sources exist before the include-path hook runs.
extra_scripts =
    pre:scripts/generate_homie.py
    pre:scripts/add_project_include.py

; The Unity suites under test/native/ are host tests for [env:native] (which clears this).
; Ignoring them here keeps a bare `pio test` from building them for, and uploading them
; to, a board.
test_ignore = native/*

[common]
; TWO PLATFORM LINES, and envs are named after the ARDUINO CORE they build against — not
; the ESP-IDF underneath it. That is what the firmware actually branches on: the only
; version conditionals in the tree are `#if ESP_ARDUINO_VERSION_MAJOR >= 3` (config.cpp,
; network.cpp); nothing tests ESP_IDF_VERSION. It also survives a pioarduino IDF patch
; bump, which would leave an "-idf5" name true but meaningless.
;
; DEFAULT (unsuffixed envs): arduino-esp32 3.3.11 / ESP-IDF 5.5.5, via the pioarduino
; fork. Pinned to a release rather than "latest" so a rebuild is reproducible, and defined
; once so five copies of the URL can't drift apart. Bump this line to move every default
; env to a new release together.
platform_arduino3 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

; LEGACY (-arduino2 envs): arduino-esp32 2.0.17 / ESP-IDF 4.4.7 — the last of the 2.0.x
; line. PINNED DELIBERATELY. These envs used a bare `platform = espressif32`, which floats
; to whatever is newest locally — and the pioarduino package above declares its own name
; as `espressif32`, so it installs into that same slot. A bare spec could therefore resolve
; to a 3.x platform and silently build the wrong side of every ESP_ARDUINO_VERSION_MAJOR
; check, which is exactly what the -arduino2 suffix promises it will not do.
platform_arduino2 = espressif32@7.0.1

; The -arduino2 envs add one post: script to [env]'s list. On an Apple Silicon Mac it builds
; the LittleFS image in Python, because this platform's mklittlefs has no arm64 macOS build;
; see scripts/littlefs_image.py.
extra_scripts_arduino2 = ${env.extra_scripts}
    post:scripts/littlefs_image.py

; BASE PLATFORM LIBS ONLY. Component-specific libraries do not belong here:
;  - lib/platform declares the modbus support deps (ModbusMaster,
;    EspSoftwareSerial) in lib/platform/library.json — PlatformIO auto-installs
;    them only when a modbus/* component in device.yml activates that library.
;  - Other components declare generator.lib_deps in their lib/<bus>/<name>.yml
;    (e.g. Adafruit_BME280 <- i2c/bme280, ATM90E32 <- spi/atm90e32_energy_meter,
;    NimBLE-Arduino <- ble/serial_bms); `ebus-esp32 generate` adds those to
;    build/platformio.ini when device.yml uses the component, so build such
;    devices with `./ebus-esp32 run` (or -c build/platformio.ini).
lib_deps =  FS
            bblanchon/ArduinoJson @ 7.4.3
            esp32async/AsyncTCP @ 3.5.0
            esp32async/ESPAsyncWebServer @ 3.9.6
            paulstoffregen/Time @ 1.6.1
            https://github.com/256dpi/arduino-mqtt.git#v2.5.3
            tobozo/YAMLDuino @ 1.5.0


; Flags that apply to every environment
; C++17 (arduino-esp32 defaults to gnu++11): enables aggregate default-member-initializers
; + designated initializers (GCC ext) for the declarative descriptor API (D2). GCC 8.4
; supports it fully. NB: the matching `build_unflags = -std=gnu++11` lives in [env], not
; here — build_unflags in [common] is inert (envs only inherit ${common.build_flags}).
build_flags =
    -std=gnu++17
    -DUSE_EBUS_TOPIC
    ; NB: no CONFIG_ASYNC_TCP_STACK_SIZE override here, deliberately. OTA image pushes
    ; write flash from an AsyncTCP callback, which looks like it should need more stack.
    ; Measured on hardware, it does not: the async_tcp task peaks at 2588 bytes for BOTH
    ; a 192KB filesystem and a 1.35MB firmware image, and the write path adds none of it —
    ; the low-water mark is identical before and after a full image. The ESP32Async fork
    ; of AsyncTCP defaults to 16384, leaving ~6x headroom, so pinning our own value would
    ; only cost DRAM and freeze out a future upstream increase. The probe that produced
    ; these numbers is still in otaPushBody() (captive_portal.cpp); re-measure if flash
    ; encryption or a TLS listener is ever enabled — those do use materially more.
    -Wall -Wextra -Wno-unused-function
    ; ebus_mqtt's publish hold (lib/ebus_core/doc/mqtt.md): the retained publishes made
    ; while the broker link is down, newest per topic. The core defaults (64 x 1024) cost
    ; about 73 KB. Each entry here is 400 bytes, 12.8 KB in all, allocated once at setup.
    ; 32 entries cover every retained topic of the largest in-tree component (the 6-CT
    ; energy meter: 27 values and $state); 256 bytes is Property::VALUE_MAX, the most a
    ; value can be. A $description is larger: it is dropped from the hold, and the
    ; reconnect callback publishes the device tree again (src/main.cpp). These are
    ; build_flags, not build_src_flags, because they set PublishHold's layout in the
    ; core library and in src/ alike.
    -DEBUS_MQTT_HOLD_ENTRIES=32
    -DEBUS_MQTT_HOLD_PAYLOAD_MAX=256
    -D CONFIG_ARDUHAL_LOG_COLORS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    ; Uncomment to enable controller features (device discovery, remote control)
    ;-DENABLE_CONTROLLER

[env:esp32-s3-devkitc-1-arduino2]
platform = ${common.platform_arduino2}
extra_scripts = ${common.extra_scripts_arduino2}
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_WIFI_AP
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-s3-devkitc-1]
; DEFAULT S3 env — arduino-esp32 3.x via the pioarduino fork (${common.platform_arduino3}).
; [env:esp32-s3-devkitc-1-arduino2] is kept alongside it on the 2.0.x line for A/B
; comparison until the port is verified on real S3 hardware; see
; https://github.com/electrification-bus/esp32-firmware/issues/1
;
; The NimBLE footprint flags from the POE-ISO env are deliberately omitted — the S3 has
; the RAM headroom, so keep parity with the -arduino2 S3 env for that comparison.
;
; CONSOLE: ARDUINO_USB_CDC_ON_BOOT is deliberately NOT set (unlike [env:esp32-s3-devkitc-1-arduino2]).
; The board JSON forces -DARDUINO_USB_MODE=1, so CDC-on-boot would bind `Serial` to
; HWCDCSerial — the native USB peripheral on GPIO19/20, i.e. the DevKitC-1's "USB" port
; only. Leaving it off keeps `Serial` on UART0 (GPIO43/44) behind the on-board USB-UART
; bridge, so `pio device monitor` on the "UART" port works at monitor_speed like every
; other env here. Set it (and use the "USB" port) only if you need native-USB CDC.
platform = ${common.platform_arduino3}
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DCONFIG_WIFI_AP
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso-arduino2]
platform = ${common.platform_arduino2}
extra_scripts = ${common.extra_scripts_arduino2}
board = esp32-poe-iso
framework = arduino
;board_build.mcu = esp32s3 ; this is an S3 variant
;board_build.flash_mode = dio
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DESP32_POE_ISO

board_build.partitions = partitions/partitions_ota.csv
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso]
; DEFAULT POE-ISO env — arduino-esp32 3.x via the pioarduino fork. [env:esp32-poe-iso-arduino2]
; is retained on the 2.0.x line until Stages 2-4 (Ethernet, NimBLE 2.x, mbedTLS 3.x) are
; fully verified on real hardware; see
; https://github.com/electrification-bus/esp32-firmware/issues/1
;
; Ethernet on 3.x needed a fix that 2.0.x never did: the ETH_GOT_IP handler called raw
; lwIP netif_set_default() from the arduino_events task, and IDF 5.x asserts on unlocked
; lwIP calls — a reboot loop on every DHCP lease. See the version split in network.cpp's
; ARDUINO_EVENT_ETH_GOT_IP case. Found on the wrover env; this env runs the same code
; path, so treat any older "Ethernet verified" note as stale.
;
; The CONFIG_BT_NIMBLE_* flags tune NimBLE's static footprint down for the non-PSRAM
; POE-ISO board; they're inert while device.yml has no ble/* component; see
; lib/ble/serial_bms.yml for context if BLE is added to this board.
platform = ${common.platform_arduino3}
board = esp32-poe-iso
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DESP32_POE_ISO
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=4
    -DCONFIG_BT_NIMBLE_WHITELIST_SIZE=1
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso-wrover-arduino2]
; ESP32-WROVER-E 4MB flash + 8MB PSRAM on Olimex POE-ISO board
platform = ${common.platform_arduino2}
extra_scripts = ${common.extra_scripts_arduino2}
board = esp32-poe-iso
framework = arduino
board_build.mcu = esp32
board_build.flash_mode = dio
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    ;-DUSE_SOFTWARE_SERIAL  ; WROVER uses HardwareSerial (SoftwareSerial crashes with PSRAM)
    -DESP32_POE_ISO
    -DBOARD_HAS_PSRAM
    ;-DCONFIG_WIFI_AP          ; disabled — WiFi stack consumes internal DRAM needed by BLE
    ; NimBLE memory reduction — BT controller needs internal DRAM (not PSRAM)
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    ; Fix PSRAM cache bug present on early ESP32 silicon revisions
    -mfix-esp32-psram-cache-issue
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso-wrover]
; DEFAULT WROVER env — ESP32-WROVER-E, 4MB flash + 8MB PSRAM. Flags mirror its 2.0.x
; twin [env:esp32-poe-iso-wrover-arduino2] except for the PSRAM errata workaround below.
platform = ${common.platform_arduino3}
board = esp32-poe-iso
framework = arduino
board_build.mcu = esp32
board_build.flash_mode = dio
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    ;-DUSE_SOFTWARE_SERIAL  ; WROVER uses HardwareSerial (SoftwareSerial crashes with PSRAM)
    -DESP32_POE_ISO
    -DBOARD_HAS_PSRAM
    ;-DCONFIG_WIFI_AP          ; disabled — WiFi stack consumes internal DRAM needed by BLE
    ; NimBLE memory reduction — BT controller needs internal DRAM (not PSRAM)
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    ; -mfix-esp32-psram-cache-issue is deliberately NOT carried over from the -arduino2 env.
    ; The errata it works around affects ESP32 rev 1 (partly rev 2); WROVER-E modules are
    ; rev 3, where it is unnecessary. It is also only half a fix here: the flag changes
    ; codegen for the sources it is applied to, and under IDF 5.x the framework ships
    ; PRECOMPILED, so the libraries would not carry the same workaround. If this board
    ; turns out to be early silicon (`esptool.py chip_id` reports the revision), the
    ; supported route is the SPIRAM cache workaround in the platform's sdkconfig, not a
    ; bare -m flag. Uncomment only as an experiment:
    ;-mfix-esp32-psram-cache-issue
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso-16mb]
; DEFAULT 16MB env — ESP32-WROOM-32E, 16MB flash, no PSRAM. 2.0.x twin:
; [env:esp32-poe-iso-16mb-arduino2].
platform = ${common.platform_arduino3}
board = esp32-poe-iso
framework = arduino
board_build.mcu = esp32
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DESP32_POE_ISO
board_build.partitions = partitions/partitions_ota_n16r8.csv
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:wesp32-poe]
; DEFAULT wESP32 env — Silicognition wESP32 (ESP32-WROOM + RTL8201). 2.0.x twin:
; [env:wesp32-poe-arduino2]. Uses the same 4 MB OTA partition table and LittleFS
; filesystem as esp32-poe-iso, which the firmware's config loader and OTA paths need.
platform = ${common.platform_arduino3}
board = wesp32
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
board_build.partitions = partitions/partitions_ota.csv
board_build.filesystem = littlefs

[env:wesp32-poe-lan8720]
; wESP32 revisions before the RTL8201 one (e.g. 2018 boards) carry a LAN8720; the
; framework's wesp32 variant assumes the RTL8201. Same pins and partitions as wesp32-poe.
platform = ${common.platform_arduino3}
board = wesp32
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DEBUS_ETH_PHY_TYPE=ETH_PHY_LAN8720
board_build.partitions = partitions/partitions_ota.csv
board_build.filesystem = littlefs

[env:esp32-poe-iso-16mb-arduino2]
; ESP32-WROOM-32E with 16MB flash, no PSRAM, on Olimex POE-ISO board
platform = ${common.platform_arduino2}
extra_scripts = ${common.extra_scripts_arduino2}
board = esp32-poe-iso
framework = arduino
board_build.mcu = esp32
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DESP32_POE_ISO

board_build.partitions = partitions/partitions_ota_n16r8.csv
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:wesp32-poe-arduino2]
board = wesp32
platform = ${common.platform_arduino2}
extra_scripts = ${common.extra_scripts_arduino2}
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
board_build.partitions = partitions/partitions_ota.csv
board_build.filesystem = littlefs

[env:seeed_xiao_esp32s3]
; No Ethernet PHY (the S3 chip has no EMAC at all) — CONFIG_WIFI_AP is required to skip
; ETH.begin() in setup_ethernet() (src/platform/network.cpp), same as esp32-s3-devkitc-1.
; ARDUINO_USB_CDC_ON_BOOT / ARDUINO_USB_MODE are already forced by the board JSON (this
; board has only a native-USB port, no separate USB-UART bridge), so unlike
; esp32-s3-devkitc-1 they don't need to be set here.
board = seeed_xiao_esp32s3
platform = ${common.platform_arduino3}
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DCONFIG_WIFI_AP
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:native]
; Host-side unit tests for the firmware's pure C/C++ logic (Unity), not a board. Run them
; with `./ebus-esp32 test`, which runs the suites in test/native/ and the core's own suites
; in the lib/ebus_core submodule (cpp-sdk's test/). Raw pio needs one suite per invocation,
; because with -c PlatformIO 6 fails every suite after the first (see cmd_test in ebus-esp32):
;   pio test -e native -c platformio/platformio.ini -f native/test_log_stream
;   PLATFORMIO_TEST_DIR=lib/ebus_core/test pio test -e native -c platformio/platformio.ini -f test_homie_id
; Links the portable core (lib/ebus_core) through lib_deps and builds nothing from src/;
; a suite that tests a src/ file #includes it. The [env] defaults are Arduino build
; plumbing, so each is overridden: no generator/include-path scripts, no forced
; log_stream.h include, and build_unflags cleared because there is no -std=gnu++11 to drop.
; PlatformIO collects only test_* directories, so test/device_test.py is not a suite.
platform = native
test_framework = unity
test_ignore =
; The core depends on ArduinoJson (its library.json says so too); listing it pins the
; same release the firmware uses.
lib_deps =
    ebus_core
    bblanchon/ArduinoJson @ 7.4.3
build_unflags =
build_src_flags =
extra_scripts =
build_flags =
    -std=gnu++17
    -Iinclude
    -Wall -Wextra
    -DUNITY_INCLUDE_DOUBLE
