; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[common]
lib_deps =  plerup/EspSoftwareSerial @ ^8.2.0
            4-20ma/ModbusMaster @ 2.0.1
            ;ElegantOTA - compiler errors
            ;ESPAsyncWebServer- compiler errors
            spacehuhn/SimpleMap @ ^1.0.0
            AsyncTCP
            paulstoffregen/Time @ ^1.6.1
            ArduinoJson
           	;PubSubClient
            https://github.com/256dpi/arduino-mqtt.git
            tobozo/YAMLDuino @ ^1.5.0
            https://github.com/adafruit/Adafruit_BME280_Library.git
            https://github.com/CircuitSetup/ATM90E32.git
            ;https://github.com/coryjfowler/MCP_CAN_lib.git
            ;cmb27/ModbusRTUSlave @ ^2.0.6 moved to lib and modified
            ;https://github.com/me-no-dev/ESPAsyncWebServer.git
            ;https://github.com/me-no-dev/AsyncTCP.git
            ;https://github.com/vshymanskyy/TinyGSM.git
            ;mikalhart/TinyGPSPlus @ ^1.1.0
            ;git+https://github.com/homieiot/homie-esp8266.git#develop

build_flags =
    ;-D__AVR__
    -DUSE_SOFTWARE_SERIAL
    ;-DBOARD_HAS_PSRAM
    ; Enable UARDUINO_USB_CDC_ON_BOOT will start printing and wait for terminal access during startup
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LilyGo: Enable UARDUINO_USB_CDC_ON_BOOT will turn off printing and will not block when using the battery
    ;-UARDUINO_USB_CDC_ON_BOOT
    ;//below from ElegantOTA
    -Wall -Wextra
    -D CONFIG_ARDUHAL_LOG_COLORS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    -D ARDUINO_ARCH_AVR ;needed for ArduinoYml?

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
board_build.partitions = partitions_ota.csv
upload_speed = 921600
board_build.filesystem = spiffs
lib_ldf_mode = deep
monitor_speed = 115200

[env:esp8266-homie]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = WiFi
            git+https://github.com/homieiot/homie-esp8266.git
build_flags = ${common.build_flags}
board_build.partitions = partitions_ota.csv
upload_speed = 921600
board_build.filesystem = spiffs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso]
platform = espressif32
board = esp32-poe-iso
framework = arduino
;board_build.mcu = esp32s3 ; this is an S3 variant
;board_build.flash_mode = dio
lib_deps = ${common.lib_deps}
build_flags =
    -D__AVR__
    -DUSE_SOFTWARE_SERIAL
    -DCONFIG_ETH_ENABLED
    -DESP32_POE_ISO
    ; Uncomment to enable controller features (device discovery, remote control)
    ;-DENABLE_CONTROLLER
board_build.partitions = partitions_ota.csv
upload_speed = 921600
board_build.filesystem = spiffs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:spiffs]
board = esp32-poe-iso
platform = espressif32
framework = arduino
upload_port = Auto
lib_deps = ${common.lib_deps}
targets = buildfs, uploadfs
board_build.flash_mode = dout
build_flags = 
	-DCS_PLATFORM=CS_P_ESP32
	-DWIFI_LED=LED_BUILTIN
	-DENABLE_DEBUG
	-DCORE_DEBUG_LEVEL=5