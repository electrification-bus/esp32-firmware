; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;The three POE-ISO envs:

;Env	               Flash    PSRAM	Module
;esp32-poe-iso	         4MB	no	    WROOM-32E
;esp32-poe-iso-16mb	    16MB	no	    WROOM-32E
;esp32-poe-iso-wrover	4MB	8MB	    WROVER-E

[platformio]
; Merge in personal overrides from a gitignored local file. Values in
; platformio_local.ini take precedence over anything below. The file is
; optional — PIO ignores a missing extra_configs path.
; See platformio_local.ini.example for a documented template; copy it to
; platformio_local.ini and edit (or leave it absent if no overrides needed).
extra_configs = platformio_local.ini

[env]
; Drop the framework's default -std=gnu++11 so our -std=gnu++17 (in [common].build_flags)
; wins. build_unflags MUST live here in [env] (auto-applied to all environments) — in
; [common] it is inert, because envs only inherit ${common.build_flags}, not its
; build_unflags. C++17 is needed for the D2 declarative descriptor structs.
build_unflags = -std=gnu++11

; Console tee: force-include platform/log_stream.h into every file under src/ so its
; `#define Serial logStream` redirects all existing Serial.printf() call sites to the
; UART + TCP tee (see include/platform/log_stream.h). build_src_flags — NOT build_flags —
; is essential: it applies only to src/, leaving the Arduino core and .pio/libdeps
; libraries compiling against the core's own `Serial`. Components under lib/ opt in via
; the #include in include/node/NodeEntity.h. Delete this line to revert to plain Serial.
build_src_flags = -include platform/log_stream.h

; generate_homie.py regenerates src/homie.cpp + data/*.yml from device.yml before
; every build, so device.yml is the single source of truth (the generated files are
; gitignored). Listed first so the sources exist before the include-path hook runs.
extra_scripts =
    pre:scripts/generate_homie.py
    pre:scripts/add_project_include.py

[common]
; BASE PLATFORM LIBS ONLY. Component-specific libraries do not belong here:
;  - lib/platform declares the modbus support deps (ModbusMaster,
;    EspSoftwareSerial) in lib/platform/library.json — PlatformIO auto-installs
;    them only when a modbus/* component in device.yml activates that library.
;  - Other components declare generator.lib_deps in their lib/<bus>/<name>.yml
;    (e.g. Adafruit_BME280 <- i2c/bme280, ATM90E32 <- spi/atm90e32_energy_meter,
;    NimBLE-Arduino <- ble/serial_bms); `ebus-esp32 generate` adds those to
;    build/platformio.ini when device.yml uses the component, so build such
;    devices with `./ebus-esp32 run` (or -c build/platformio.ini).
lib_deps =  FS
            ArduinoJson
            AsyncTCP
            esp32async/ESPAsyncWebServer @ 3.9.6
            paulstoffregen/Time @ ^1.6.1
            https://github.com/256dpi/arduino-mqtt.git
            tobozo/YAMLDuino @ ^1.5.0


; Flags that apply to every environment
; C++17 (arduino-esp32 defaults to gnu++11): enables aggregate default-member-initializers
; + designated initializers (GCC ext) for the declarative descriptor API (D2). GCC 8.4
; supports it fully. NB: the matching `build_unflags = -std=gnu++11` lives in [env], not
; here — build_unflags in [common] is inert (envs only inherit ${common.build_flags}).
build_flags =
    -std=gnu++17
    -DUSE_EBUS_TOPIC
    ; NB: no CONFIG_ASYNC_TCP_STACK_SIZE override here, deliberately. OTA image pushes
    ; write flash from an AsyncTCP callback, which looks like it should need more stack.
    ; Measured on hardware, it does not: the async_tcp task peaks at 2588 bytes for BOTH
    ; a 192KB filesystem and a 1.35MB firmware image, and the write path adds none of it —
    ; the low-water mark is identical before and after a full image. The ESP32Async fork
    ; of AsyncTCP defaults to 16384, leaving ~6x headroom, so pinning our own value would
    ; only cost DRAM and freeze out a future upstream increase. The probe that produced
    ; these numbers is still in otaPushBody() (captive_portal.cpp); re-measure if flash
    ; encryption or a TLS listener is ever enabled — those do use materially more.
    -Wall -Wextra -Wno-unused-function
    -D CONFIG_ARDUHAL_LOG_COLORS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    ; Uncomment to enable controller features (device discovery, remote control)
    ;-DENABLE_CONTROLLER

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_WIFI_AP
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 921600
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-s3-devkitc-1-idf5]
; Stage 1 of https://github.com/electrification-bus/esp32-sdk/issues/3 — arduino-esp32
; 3.x (ESP-IDF 5.x) via the pioarduino fork, pinned to the same release as
; [env:esp32-poe-iso-idf5]. Parallel env, not a replacement for
; [env:esp32-s3-devkitc-1] — that stays on the official 2.0.x platform until the
; IDF 5.x port is verified on real S3 hardware.
;
; The NimBLE footprint flags from the POE-ISO idf5 env are deliberately omitted — the
; S3 has the RAM headroom, so keep parity with the 2.0.x S3 env for A/B comparison.
;
; CONSOLE: ARDUINO_USB_CDC_ON_BOOT is deliberately NOT set (unlike [env:esp32-s3-devkitc-1]).
; The board JSON forces -DARDUINO_USB_MODE=1, so CDC-on-boot would bind `Serial` to
; HWCDCSerial — the native USB peripheral on GPIO19/20, i.e. the DevKitC-1's "USB" port
; only. Leaving it off keeps `Serial` on UART0 (GPIO43/44) behind the on-board USB-UART
; bridge, so `pio device monitor` on the "UART" port works at monitor_speed like every
; other env here. Set it (and use the "USB" port) only if you need native-USB CDC.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DCONFIG_WIFI_AP
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 921600
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp8266-homie]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = WiFi
            git+https://github.com/homieiot/homie-esp8266.git
build_flags = ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 921600
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso]
platform = espressif32
board = esp32-poe-iso
framework = arduino
;board_build.mcu = esp32s3 ; this is an S3 variant
;board_build.flash_mode = dio
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DESP32_POE_ISO

board_build.partitions = partitions/partitions_ota.csv
upload_speed = 921600
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso-idf5]
; Stage 1 of https://github.com/electrification-bus/esp32-sdk/issues/3 — arduino-esp32
; 3.x (ESP-IDF 5.x) via the pioarduino fork, pinned to a specific release (not "latest").
; Parallel env, not a replacement for [env:esp32-poe-iso] — that stays on the official
; 2.0.x platform until Stages 2-4 (Ethernet, NimBLE 2.x, mbedTLS 3.x) are fully verified
; on real hardware. Boots and runs the modbus/sht20 device tree over Ethernet on real
; hardware as of this env's current state.
;
; The CONFIG_BT_NIMBLE_* flags tune NimBLE's static footprint down for the non-PSRAM
; POE-ISO board; they're inert while device.yml has no ble/* component; see
; lib/ble/serial_bms.yml for context if BLE is added to this board.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-poe-iso
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DESP32_POE_ISO
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=4
    -DCONFIG_BT_NIMBLE_WHITELIST_SIZE=1
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 921600
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso-wrover]
; ESP32-WROVER-E 4MB flash + 8MB PSRAM on Olimex POE-ISO board
platform = espressif32
board = esp32-poe-iso
framework = arduino
board_build.mcu = esp32
board_build.flash_mode = dio
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    ;-DUSE_SOFTWARE_SERIAL  ; WROVER uses HardwareSerial (SoftwareSerial crashes with PSRAM)
    -DESP32_POE_ISO
    -DBOARD_HAS_PSRAM
    ;-DCONFIG_WIFI_AP          ; disabled — WiFi stack consumes internal DRAM needed by BLE
    ; NimBLE memory reduction — BT controller needs internal DRAM (not PSRAM)
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    ; Fix PSRAM cache bug present on early ESP32 silicon revisions
    -mfix-esp32-psram-cache-issue
board_build.partitions = partitions/partitions_ota.csv
upload_speed = 921600
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso-16mb]
; ESP32-WROOM-32E with 16MB flash, no PSRAM, on Olimex POE-ISO board
platform = espressif32
board = esp32-poe-iso
framework = arduino
board_build.mcu = esp32
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DESP32_POE_ISO

board_build.partitions = partitions/partitions_ota_n16r8.csv
upload_speed = 921600
board_build.filesystem = littlefs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:wesp32-poe]
board = wesp32
platform = espressif32
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

[env:spiffs]
board = esp32-poe-iso
platform = espressif32
framework = arduino
upload_port = Auto
lib_deps = ${common.lib_deps}
targets = buildfs, uploadfs
board_build.flash_mode = dout
build_flags = ${common.build_flags}
