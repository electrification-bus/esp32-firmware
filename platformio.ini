; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;The three POE-ISO envs:

;Env	               Flash    PSRAM	Module
;esp32-poe-iso	         4MB	no	    WROOM-32E
;esp32-poe-iso-16mb	    16MB	no	    WROOM-32E
;esp32-poe-iso-wrover	4MB	8MB	    WROVER-E

[common]
lib_deps =  plerup/EspSoftwareSerial @ ^8.2.0
            4-20ma/ModbusMaster @ 2.0.1
            esp32async/ESPAsyncWebServer @ 3.9.6
            spacehuhn/SimpleMap @ ^1.0.0
            AsyncTCP
            paulstoffregen/Time @ ^1.6.1
            ArduinoJson
           	;PubSubClient
            https://github.com/256dpi/arduino-mqtt.git
            tobozo/YAMLDuino @ ^1.5.0
            https://github.com/adafruit/Adafruit_BME280_Library.git
            https://github.com/CircuitSetup/ATM90E32.git
            h2zero/NimBLE-Arduino @ ^1.4.0
            ;https://github.com/coryjfowler/MCP_CAN_lib.git
            ;cmb27/ModbusRTUSlave @ ^2.0.6 moved to lib and modified
            ;https://github.com/me-no-dev/ESPAsyncWebServer.git
            ;https://github.com/me-no-dev/AsyncTCP.git
            ;https://github.com/vshymanskyy/TinyGSM.git
            ;mikalhart/TinyGPSPlus @ ^1.1.0
            ;git+https://github.com/homieiot/homie-esp8266.git#develop

; Flags that apply to every environment
build_flags =
    -DUSE_EBUS_TOPIC
    -Wall -Wextra
    -D CONFIG_ARDUHAL_LOG_COLORS
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    ; Uncomment to enable controller features (device discovery, remote control)
    -DENABLE_CONTROLLER

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DUSE_SOFTWARE_SERIAL
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_WIFI_AP
board_build.partitions = partitions_ota.csv
upload_speed = 921600
board_build.filesystem = spiffs
lib_ldf_mode = deep
monitor_speed = 115200

[env:esp8266-homie]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = WiFi
            git+https://github.com/homieiot/homie-esp8266.git
build_flags = ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = partitions_ota.csv
upload_speed = 921600
board_build.filesystem = spiffs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso]
platform = espressif32
board = esp32-poe-iso
framework = arduino
;board_build.mcu = esp32s3 ; this is an S3 variant
;board_build.flash_mode = dio
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -D__AVR__
    -DUSE_SOFTWARE_SERIAL
    -DCONFIG_ETH_ENABLED
    -DESP32_POE_ISO

board_build.partitions = partitions_ota.csv
upload_speed = 921600
board_build.filesystem = spiffs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso-wrover]
; ESP32-WROVER-E 4MB flash + 8MB PSRAM on Olimex POE-ISO board
platform = espressif32
board = esp32-poe-iso
framework = arduino
board_build.mcu = esp32
board_build.flash_mode = dio
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    ;-DUSE_SOFTWARE_SERIAL  ; WROVER uses HardwareSerial (SoftwareSerial crashes with PSRAM)
    -DCONFIG_ETH_ENABLED
    -DESP32_POE_ISO
    -DBOARD_HAS_PSRAM
    ;-DCONFIG_WIFI_AP          ; disabled — WiFi stack consumes internal DRAM needed by BLE
    ;-DCONFIG_AP_TIMEOUT=1
    ; NimBLE memory reduction — BT controller needs internal DRAM (not PSRAM)
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DENABLE_CONTROLLER
board_build.partitions = partitions_ota.csv
upload_speed = 921600
board_build.filesystem = spiffs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32-poe-iso-16mb]
; ESP32-WROOM-32E with 16MB flash, no PSRAM, on Olimex POE-ISO board
platform = espressif32
board = esp32-poe-iso
framework = arduino
board_build.mcu = esp32
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -D__AVR__
    -DUSE_SOFTWARE_SERIAL
    -DCONFIG_ETH_ENABLED
    -DESP32_POE_ISO

board_build.partitions = partitions_ota_n16r8.csv
upload_speed = 921600
board_build.filesystem = spiffs
lib_ldf_mode = deep+
monitor_speed = 115200

[env:wesp32-poe]
board = wesp32
platform = espressif32
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
    -DCONFIG_ETH_ENABLED
    -DWESP32_POE

[env:spiffs]
board = esp32-poe-iso
platform = espressif32
framework = arduino
upload_port = Auto
lib_deps = ${common.lib_deps}
targets = buildfs, uploadfs
board_build.flash_mode = dout
build_flags = ${common.build_flags}
    -DCS_PLATFORM=CS_P_ESP32
    -DWIFI_LED=LED_BUILTIN
    -DENABLE_DEBUG
