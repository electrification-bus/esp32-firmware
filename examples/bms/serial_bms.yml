# ─────────────────────────────────────────────────────────────────────────────
# COPY/PASTE EXAMPLE — not discovered where it sits.
#
# `ebus-esp32 generate` only looks under lib/<bus>/<name>.yml, so device.yml cannot
# reference this file from examples/. To use it:
#
#     cp examples/bms/serial_bms.{h,cpp,yml} lib/ble/
#
# then add `- component: ble/serial_bms` to device.yml. See README.md in this folder.
# ─────────────────────────────────────────────────────────────────────────────
homie: 5.0.1
name: EBUS
type: ebus
state: init
nodes:
  - id: battery-bms
    name: JBD Smart BMS
    type: battery
    properties:
      - id: voltage
        name: Pack Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 0.0
      - id: current
        name: Current
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 0.0
      - id: soc
        name: State of Charge
        datatype: integer
        unit: "%"
        format: "0:100"
        settable: false
        retained: true
        value: 0
      - id: remain-capacity
        name: Remaining Capacity
        datatype: float
        unit: Ah
        settable: false
        retained: true
        value: 0.0
      - id: nominal-capacity
        name: Nominal Capacity
        datatype: float
        unit: Ah
        settable: false
        retained: true
        value: 0.0
      - id: cycles
        name: Charge Cycles
        datatype: integer
        unit: ''          # dimensionless count
        settable: false
        retained: true
        value: 0
      - id: mosfet-charge
        name: Charge MOSFET
        datatype: boolean
        settable: true
        retained: true
        value: false
      - id: mosfet-discharge
        name: Discharge MOSFET
        datatype: boolean
        settable: false
        retained: true
        value: false
      - id: temperature
        name: Temperature
        datatype: float
        unit: "°C"
        settable: false
        retained: true
        value: 0.0
      - id: cell-voltages
        name: Cell Voltages
        datatype: string
        settable: false
        retained: true
        value: ''
        description: "Comma-separated cell voltages in V"
      - id: charge-control
        name: Charge Control
        datatype: boolean
        settable: true
        retained: true
        value: false
      - id: rescan
        name: Rescan BLE
        datatype: boolean
        settable: true
        retained: false
        value: false
        description: "Set true to clear saved BMS address and scan for a new device"
      - id: charge-threshold-low
        name: Low SOC Threshold
        datatype: integer
        unit: "%"
        value: 22
        settable: true
        retained: true
        description: "SOC percentage below which charging will be enabled"
      - id: charge-threshold-high
        name: High SOC Threshold
        datatype: integer
        unit: "%"
        value: 88
        settable: true
        retained: true
        description: "SOC percentage above which charging will be disabled"
      - id: peak-begin-min
        name: Peak Window Start (minutes-of-day)
        datatype: integer
        unit: min          # value is minutes-of-day
        value: 955
        settable: true
        retained: true
        description: "Peak window start in minutes-of-day (e.g. 955 = 15:55)"
      - id: peak-end-min
        name: Peak Window End (minutes-of-day)
        datatype: integer
        unit: min          # value is minutes-of-day
        value: 1265
        settable: true
        retained: true
        description: "Peak window end in minutes-of-day (e.g. 1265 = 21:05)"
      - id: threshold-discharge-daily
        name: Threshold Discharge Daily
        datatype: boolean
        value: false
        settable: true
        retained: true
        description: "When true, discharge to low SOC threshold before charging at off-peak start"
extensions: []
implementation: homie-esp32-sdk
generator:
  class: SerialBMS
  header: ble/serial_bms.h
  constructor: '("{id}")'
  # NimBLE-Arduino 2.x's static footprint (~6-7KB DRAM) can overflow the DRAM
  # budget on non-PSRAM boards (e.g. esp32-poe-iso: no PSRAM, ~320KB total SRAM)
  # once Ethernet/MQTT/TLS/Modbus/etc. are also linked in. platformio.ini's
  # esp32-poe-iso env already trims this with CONFIG_BT_NIMBLE_ROLE_*_DISABLED
  # / MAX_CONNECTIONS=1 / MAX_BONDS=1 (this project only ever acts as a BLE client
  # connecting to one BMS), which helps but may not be enough by itself — the
  # PSRAM-equipped esp32-poe-iso-wrover env is the reliable target for BLE-equipped
  # devices. Don't assume "compiles" means "links" for this component on a
  # non-PSRAM board without checking the DRAM usage report.
  lib_deps:
    - h2zero/NimBLE-Arduino @ ^2.0.0
