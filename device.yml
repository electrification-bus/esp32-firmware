# Homie device definition — single source of truth.
# Edit this file, then run `./ebus-esp32 run` to generate, build, and flash.
# src/homie.cpp + data/*.yml are regenerated from here automatically before every
# build (they are gitignored); `./ebus-esp32 generate` regenerates them on their own.
#
# Available components (lib/<bus>/<name>.yml):
#   i2c/bme280                  — BME280 temp/pressure/humidity (I2C); needs buses.i2c, config: address
#   i2c/gme12864                — 0.96" 128x64 SSD1306 OLED (I2C); needs buses.i2c, config: address (0x3C)
#   modbus/sht20                — SHT20 temp/humidity (Modbus RTU); needs buses.rs485
#   modbus/eletechsup32         — 32-ch voltage detector (Modbus RTU); needs buses.rs485
#   modbus/register_device      — any Modbus RTU device described by a registers: map; needs buses.rs485
#   gpio/digital_output         — one GPIO as a settable boolean output (relay, SSR,
#                                 contactor, LED, valve); requires pin, active_low, initial_state
#   ble/gatt_device             — generic BLE GATT device (any service/notify/write UUIDs)
#   (ble/serial_bms — JBD Smart BMS — is now a copy/paste example: examples/bms/)
#   spi/atm90e32_energy_meter   — 6-CT energy meter (SPI); needs buses.spi, config: pin_cs1, pin_cs2
#
# Bus pins are board facts shared by every node on that bus, so they are declared once
# in the buses: block below; a node's config: holds only what is per device (an address).
#
# As shipped this device needs no extra hardware: its one node drives GPIO 14, which is
# free on the Olimex ESP32-POE-ISO. To use a real sensor, uncomment its bus under buses:
# and replace the node under nodes:. examples/sht20/device.yml is an SHT20 on RS485, and
# examples/ has more; `./ebus-esp32 build examples/<name>/device.yml` builds one in place.

device:
  name: ebus-demo
  # id is a TEMPLATE, resolved on-device at boot to a Homie-legal id. Device-ids are
  # OPAQUE (consumers identify by $type + info/serial-number, never by parsing the id).
  # Placeholders: ${chip_id} (full eFuse MAC hex, unique), ${chip_id_short} (last 3
  # bytes), ${name}. No quoting needed. Empty/omitted -> "${chip_id}". A fixed literal
  # (no placeholder) collides across units.
  #   ${chip_id} -> a1b2c3d4e5f6   |   ebus-${chip_id} -> ebus-a1b2c3d4e5f6
  id: ${chip_id}
  # id_prefix is an OPTIONAL deployment-scoped segment prepended to the resolved id with a
  # hyphen: id_prefix "lab1" + id "ebus-${chip_id}" -> "lab1-ebus-a1b2c3d4e5f6". It is
  # sanitized to Homie-legal characters on its own, so "Lab 1" also yields "lab1". Empty or
  # omitted = no prefix. It adds NO per-unit uniqueness (every board on a site shares it) —
  # keep a ${chip_id} in `id:`. Usually set from config-overlay.yml so a site can namespace
  # its fleet without touching this tracked file.
  id_prefix: ''
  type: control
  # environment names a [env:…] section in platformio.ini — NOT a PlatformIO `board`.
  # An env pins platform (arduino-esp32 3.x vs 2.0.x), board, PSRAM, flash size, partitions
  # and build flags together; six envs here share `board = esp32-poe-iso` and differ only
  # in those, so the env name is the only thing that selects a build.
  environment: esp32-poe-iso
  device_type: ebus
  firmware_name: ESP32-POE-ISO Firmware
  firmware_version: 1.0.0
  # Pull-OTA sources: the device downloads these itself when told to (portal, or
  # ./ebus-esp32 push --pull). Both are optional — `push --pull` supplies its own URLs.
  # https works if a CA for the host is at data/certs/<Host>.ca; without one the
  # transfer is encrypted but the server is not verified.
  firmware_url: http://example.com/firmware.bin
  fs_url: 
  # mDNS device info
  manufacturer: Example Manufacturer
  model: ESP32-POE-ISO
  serial_number:   # leave empty to use device_id
  homie_role: device  # "device" or "controller"
  device_passphrase: ""  # set it in config-overlay.yml; generate refuses an empty or "changeme" value

wifi:
  ssid: ''
  password: ''

mqtt:
  # mqtt_mode controls how the MQTT broker is resolved:
  #   configured-only         - use only the mqtt_host/port from this config file
  #   discovery-with-fallback - try mDNS discovery first, fall back to config if none found
  #   discovery-only          - use only mDNS discovery, ignore configured mqtt_host/port
  mode: configured-only
  host: ''
  port: 1883
  username: ''
  password: ''
  # qos: QoS for retained Homie publications ($state, $description, property values).
  # Homie 5 recommends 2 (default if omitted). Non-retained messages and /set are
  # always QoS 0 per spec. Valid: 0, 1, 2.
  qos: 2

# mDNS. arduino-esp32 3.x builds always claim <device id>.local (the resolved
# device.id, e.g. b0b21c90f570.local; not device.name), whatever this block says.
# These keys gate only the querier (discovery) and the service records (advertise):
#   3.x Ethernet (the default, unsuffixed envs)   advertise ON,  discovery ON
#   3.x WiFi-AP                                   advertise ON,  discovery OFF
#   every -arduino2 env                           both OFF, and no hostname claim
# The 2.0.x exclusion is deliberate: its precompiled mDNS responder has an upstream
# null-deref on inbound packets (doc/MDNS.md). 3.x carries the rewrite.
# On 3.x, `enabled: false` turns off discovery and advertising; the hostname stays.
#
# COMMENT THIS BLOCK OUT to accept the build default. Setting it — true or false —
# pins the behavior for every build of this device.
#mdns:
#  enabled: false

# Serial console over TCP. The firmware tees every Serial.printf() to this port as
# well as the UART, so an installed board can be watched without a USB cable:
#   ./ebus-esp32 monitor --host 10.0.0.5   (explicit IP; --host implies the network)
#   ./ebus-esp32 monitor --net             (address learned from a previous USB session)
#   ./ebus-esp32 run --monitor             (flash, then attach)
#   pio device monitor --port socket://<device-ip>:23
# A new client is replayed the ring buffer first, so the boot log is not lost.
# 0 disables the listener. UNAUTHENTICATED — use 0 on networks where the log should
# not be readable by everyone on the LAN.
log:
  tcp_port: 23

# Shared bus pins, one block per physical bus. Reference values by board: doc/GPIOPins.md.
#   rs485: pin_a -> the RS485 module's "RXD" pin, pin_b -> its "TXD" pin (all modbus/* nodes)
#   i2c:   pin_sda / pin_scl (all i2c/* nodes; WROVER boards keep SCL off GPIO 16/17)
#   spi:   pin_sck / pin_miso / pin_mosi (all spi/* nodes; chip-selects stay per node)
buses:
  #rs485: { pin_a: 36, pin_b: 4 }
  #i2c:   { pin_sda: 13, pin_scl: 16 }
  #spi:   { pin_sck: 14, pin_miso: 34, pin_mosi: 15 }

nodes:
  # A settable boolean on GPIO 14. Nothing needs to be connected; wire an LED and a
  # resistor from GPIO 14 to GND to see it follow
  #   mosquitto_pub -t 'ebus/5/<device-id>/led/state/set' -m true
  - component: gpio/digital_output
    id: led
    config:
      pin: 14
      active_low: false
      initial_state: false
