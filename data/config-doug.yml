homie: 5.0.1
name: ESP32POEISO
config: 
  - wifi_ssid: 
    wifi_password: 
    mqtt_host: 192.168.1.70
    mqtt_port: 1883
    mqtt_username:
    mqtt_password:
    device_id: esp32poeiso
    device_name: ESP32 POE ISO Homie
    device_type: sensor
    firmware_name: ESP32POEISO Firmware
    firmware_version: 1.0.0
    firmware_url: http://example.com/firmware.bin
state: init
nodes:
  - id: temperature
    name: Temperature Sensor
    type: sensor
    properties:
      - id: degrees
        name: Temperature
        datatype: float
        unit: °C
        settable: false
        retained: true
        value: 72.4
  - id: led
    name: LED
    type: switch
    properties:
      - id: 'on'
        name: On/Off
        datatype: boolean
        settable: true
        retained: true
        value: false

  - id: meter_volts
    name: Voltage Sensor
    type: energy
    properties:
      - id: volts
        name: Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 120.0
  - id: meter_current
    name: Current Sensor
    type: energy
    properties:
      - id: amps
        name: Current
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 1.0
  - id: meter_watts
    name: Power Sensor
    type: energy
    properties:
      - id: watts
        name: Power
        datatype: float
        unit: W
        settable: false
        retained: true
        value: 0.0
  - id: meter_kwh
    name: Energy Consumption
    type: energy
    properties:
      - id: kwh
        name: Energy
        datatype: float
        unit: kWh
        settable: false
        retained: true
        value: 0.0
  - id: ota
    name: OTA Updates
    type: ota
    properties:
      - id: update
        name: Update Firmware
        datatype: boolean
        settable: true
        retained: false
        value: false
extensions: []
implementation: homie-esp32-sdk
