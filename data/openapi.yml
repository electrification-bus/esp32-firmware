openapi: 3.0.3
info:
  title: Homie ESP32 Configuration API
  description: |
    REST API served by the device's HTTP server on port 80, on every interface the device has.
    - Builds with CONFIG_WIFI_AP also serve it on an open setup AP (192.168.4.1), which shuts down
      2 minutes after the WiFi STA side gets an address, and add the WiFi and captive-portal paths
      tagged "WiFi AP only".
    - Other builds serve it over Ethernet (and WiFi STA when credentials are configured).

    Protected operations accept HTTP Basic or Digest auth (username "admin", password the device
    passphrase) or a session token from POST /api/login in the X-Session-Token header.

    Every request passes a body guard that reads only the headers, before the body is read or any
    credentials are checked: POST /api/ota/firmware and /api/ota/filesystem take only
    application/octet-stream; POST /api/broker-cert takes only application/x-pem-file or
    application/octet-stream, at most 2047 bytes; any other request with a body takes only
    application/json, at most 2047 bytes. A larger body gets 413, any other Content-Type (and any
    request with a multipart/* Content-Type header) gets 415.
  version: 1.2.0

servers:
  - url: "http://{device}"
    description: The device's address on the LAN
    variables:
      device:
        default: "192.168.1.100"
        description: IP address (or mDNS name) of the device
  - url: http://192.168.4.1
    description: Setup AP (CONFIG_WIFI_AP builds, until it shuts down)

tags:
  - name: WiFi AP only
    description: Registered only on builds with CONFIG_WIFI_AP

paths:
  /:
    get:
      summary: Setup page
      description: Serves /html/config.html from LittleFS.
      responses:
        "200":
          description: HTML setup page
          content:
            text/html:
              schema:
                type: string
        "500":
          description: config.html could not be opened
          content:
            text/plain:
              schema:
                type: string

  /api/device-info:
    get:
      summary: Device information
      description: >
        Returns the device name, its Homie topic, its role, and the OTA image URLs set through the
        portal (empty when the URL comes from config.yml).
      responses:
        "200":
          description: Device info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "greenhouse-controller"
                  topic:
                    type: string
                    example: "ebus/5/abc123def/"
                  wifi_enabled:
                    type: boolean
                    description: true on CONFIG_WIFI_AP builds
                    example: false
                  role:
                    type: string
                    enum: [device, controller]
                  fw_url:
                    type: string
                    example: ""
                  fs_url:
                    type: string
                    example: ""

  /api/mqtt-status:
    get:
      summary: MQTT connection status
      responses:
        "200":
          description: MQTT status
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [connected, searching, failed, none]
                  broker:
                    type: string
                    example: "192.168.1.100"
                  port:
                    type: integer
                    example: 1883
                  fallback_broker:
                    type: string
                    description: Configured fallback broker while mDNS discovery is still searching
                  fallback_port:
                    type: integer
              examples:
                connected:
                  value:
                    status: connected
                    broker: "192.168.1.100"
                    port: 1883
                searching:
                  value:
                    status: searching
                    fallback_broker: "192.168.1.100"
                    fallback_port: 1883
                none:
                  value:
                    status: none

  /api/login:
    post:
      summary: Issue a session token
      description: |
        Returns a random session token. Later requests may send it in the X-Session-Token header
        instead of the passphrase. One session exists at a time; a new login replaces the previous
        token. It expires after 15 minutes without use or 2 hours after login, and on reboot,
        POST /api/passphrase or POST /api/reset-prefs.
      security:
        - basicAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: Session token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: 32 hexadecimal characters
                    example: "3fa85f64c9b2de7a1a2b3c4d5e6f7a8b"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/mqtt:
    post:
      summary: Save MQTT configuration
      description: |
        Saves the MQTT broker settings to NVS, invalidates the cached CA certificate, and makes
        the main loop reconnect MQTT with the new settings.
      security:
        - basicAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                broker:
                  type: string
                  description: MQTT broker hostname or IP
                  example: "192.168.1.100"
                port:
                  type: integer
                  description: MQTT broker port (1883 when absent)
                  default: 1883
                  example: 8883
                username:
                  type: string
                  example: "device1"
                password:
                  type: string
                  example: "secret"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/firmware:
    post:
      summary: Set the firmware URL and pull the image
      description: >
        Sets the firmware image URL, opens the OTA window, and queues a download. https is
        supported; the device verifies the server only if a CA for it is present at
        /certs/<Host>.ca, otherwise the transfer is encrypted but unverified.
      security:
        - basicAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/persist"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Firmware image URL
                  example: "http://192.168.1.10/firmware.bin"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/filesystem:
    post:
      summary: Set the filesystem URL and pull the image
      description: >
        Sets the LittleFS image URL, opens the OTA window, and queues a download. Same https and
        query-flag behavior as /api/firmware. A staged filesystem is always applied before a
        staged firmware.
      security:
        - basicAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/persist"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: LittleFS image URL
                  example: "http://192.168.1.10/littlefs.bin"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/passphrase:
    post:
      summary: Change the device passphrase
      description: >
        Saves a new passphrase to NVS, where it overrides config.yml. It takes effect immediately
        and ends the current session. A blank passphrase, "changeme" in any case after trimming
        surrounding whitespace, or one longer than 63 bytes is refused with 400 and the old
        passphrase stays in effect.
      security:
        - basicAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - passphrase
              properties:
                passphrase:
                  type: string
                  maxLength: 63
                  description: At most 63 bytes
      responses:
        "200":
          description: Passphrase saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                status: ok
                message: "Passphrase saved. Takes effect immediately."
        "400":
          description: >
            Empty body, invalid JSON, missing passphrase field, or a refused passphrase (blank,
            "changeme", or longer than 63 bytes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                message: "Passphrase 'changeme' is a published placeholder; choose your own"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/reset-prefs:
    post:
      summary: Clear the settings saved in NVS
      description: >
        Clears the WiFi, MQTT, OTA URL and passphrase settings saved through the portal and ends
        the current session. config.yml applies again after a reboot.
      security:
        - basicAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: Preferences cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                status: ok
                message: "Preferences cleared. Reboot to use YML config."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/reboot:
    post:
      summary: Reboot the device
      security:
        - basicAuth: []
        - sessionAuth: []
      responses:
        "200":
          description: Reboot acknowledged; the device restarts about 500 ms later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                status: ok
                message: "Rebooting..."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/openapi.yml:
    get:
      summary: OpenAPI description
      description: Returns this document from LittleFS.
      responses:
        "200":
          description: OpenAPI 3.0.3 description in YAML
          content:
            text/yaml:
              schema:
                type: string

  /api/broker-cert:
    get:
      summary: Download the broker CA certificate
      description: Returns the CA certificate saved on LittleFS for the current MQTT broker.
      responses:
        "200":
          description: PEM-encoded CA certificate
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No broker configured or no certificate found
          content:
            text/plain:
              schema:
                type: string
    post:
      summary: Upload a broker CA certificate
      description: |
        Saves a PEM-encoded CA certificate to LittleFS as /certs/uploaded-cert.ca and invalidates
        the cached certificate so the next MQTT connection uses the new one. text/plain is refused
        because the web server library can parse a PEM body sent as text/plain into form
        parameters.
      security:
        - basicAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        description: At most 2047 bytes.
        content:
          application/x-pem-file:
            schema:
              type: string
              description: PEM-encoded CA certificate (must contain a BEGIN CERTIFICATE line)
          application/octet-stream:
            schema:
              type: string
              description: PEM-encoded CA certificate (must contain a BEGIN CERTIFICATE line)
      responses:
        "200":
          description: Certificate saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  bytes:
                    type: integer
                    example: 1234
                  path:
                    type: string
                    example: "/certs/uploaded-cert.ca"
        "400":
          description: Empty body or not a PEM certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The certificate file could not be written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/ota:
    get:
      summary: OTA status
      description: >
        Reports the state of the last pull OTA and the device's uptime. A client whose push reply
        was lost can compare uptime_s to tell whether the device restarted.
      responses:
        "200":
          description: OTA status
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - uptime_s
                properties:
                  status:
                    type: string
                    enum: [idle, downloading, host_not_found, file_not_found, http_error,
                           write_error, download_incomplete, complete]
                  host:
                    type: string
                  file:
                    type: string
                  url:
                    type: string
                  http_code:
                    type: integer
                    description: Present when status is http_error
                  uptime_s:
                    type: number
                    description: Seconds since boot, to the millisecond
                    example: 1234.567
    post:
      summary: Open or close the OTA window
      description: >
        The push endpoints refuse an image unless the OTA window is open. It closes after
        timeout_minutes (OTA_ENABLED_TIMEOUT, default 10, 0 for no timeout) and is always closed
        after a reboot.
      security:
        - basicAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  example: true
      responses:
        "200":
          description: OTA window opened or closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  ota_enabled:
                    type: boolean
                    example: true
                  timeout_minutes:
                    type: integer
                    example: 10
        "400":
          description: Empty body, invalid JSON, or missing 'enabled' boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/ota/firmware:
    post:
      summary: Push a firmware image
      description: >
        Streams the request body into the inactive app partition. Requires the OTA window to be
        open. The image must start with the ESP image magic byte (0xE9). One push runs at a time.
        Unless reboot=0, the device restarts once the reply has been delivered.
      security:
        - basicAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/reboot"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          $ref: "#/components/responses/PushOk"
        "400":
          $ref: "#/components/responses/PushFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/PushBusy"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/ota/filesystem:
    post:
      summary: Push a LittleFS image
      description: >
        Streams the request body into the filesystem partition, which is unmounted for the write.
        Requires the OTA window to be open. One push runs at a time. Unless reboot=0, the device
        restarts once the reply has been delivered; with reboot=0 the filesystem is remounted.
      security:
        - basicAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/reboot"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          $ref: "#/components/responses/PushOk"
        "400":
          $ref: "#/components/responses/PushFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/PushBusy"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/wifi-scan:
    get:
      summary: WiFi scan results
      description: Networks found by the scan at boot, deduplicated and strongest first.
      tags:
        - WiFi AP only
      responses:
        "200":
          description: Discovered WiFi networks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ssid:
                      type: string
                      example: "MyNetwork"
                    rssi:
                      type: integer
                      description: Signal strength in dBm
                      example: -45
                    secure:
                      type: boolean
                      description: Whether the network requires a password
                      example: true

  /api/wifi:
    post:
      summary: Connect to a WiFi network
      description: >
        Saves WiFi credentials to NVS and starts a STA connection; poll /api/wifi-status for the
        result. Unauthenticated while the setup AP is up; once the AP has shut down it requires
        auth like the admin endpoints.
      tags:
        - WiFi AP only
      security:
        - {}
        - basicAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssid:
                  type: string
                  example: "MyNetwork"
                password:
                  type: string
                  example: "mypassword"
      responses:
        "200":
          description: Connection attempt started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: connecting
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/NoPassphrase"

  /api/wifi-status:
    get:
      summary: WiFi STA connection status
      tags:
        - WiFi AP only
      responses:
        "200":
          description: WiFi connection status
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [connected, connecting, auth_fail, no_ssid, failed]
                  ip:
                    type: string
                    example: "192.168.1.42"
                  ssid:
                    type: string
                    example: "MyNetwork"
                  reason:
                    type: integer
                    description: ESP32 WiFi disconnect reason code (on failure)
                    example: 15
                  message:
                    type: string
                    example: "Wrong password (reason 15)"
              examples:
                connected:
                  value:
                    status: connected
                    ip: "192.168.1.42"
                    ssid: "MyNetwork"
                auth_fail:
                  value:
                    status: auth_fail
                    reason: 15
                    message: "Wrong password (reason 15)"
                no_ssid:
                  value:
                    status: no_ssid
                    reason: 201
                    message: "Network not found"

  /generate_204:
    get:
      summary: Android captive portal detection
      tags: [WiFi AP only]
      responses:
        "302":
          $ref: "#/components/responses/CaptiveRedirect"

  /fwlink:
    get:
      summary: Windows captive portal detection
      tags: [WiFi AP only]
      responses:
        "302":
          $ref: "#/components/responses/CaptiveRedirect"

  /hotspot-detect.html:
    get:
      summary: Apple captive portal detection
      tags: [WiFi AP only]
      responses:
        "302":
          $ref: "#/components/responses/CaptiveRedirect"

  /connecttest.txt:
    get:
      summary: Windows captive portal detection
      tags: [WiFi AP only]
      responses:
        "302":
          $ref: "#/components/responses/CaptiveRedirect"

  /redirect:
    get:
      summary: Captive portal detection
      tags: [WiFi AP only]
      responses:
        "302":
          $ref: "#/components/responses/CaptiveRedirect"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Username "admin", password the device passphrase (device.device_passphrase in config.yml,
        or the value saved by POST /api/passphrase). Digest auth with the same credentials is also
        accepted. Five wrong Authorization headers lock passphrase auth out for 5 minutes.
    sessionAuth:
      type: apiKey
      in: header
      name: X-Session-Token
      description: |
        Session token from POST /api/login. Accepted during a lockout. Expires after 15 minutes
        without use or 2 hours after login, and on reboot, passphrase change or reset-prefs.

  parameters:
    start:
      in: query
      name: start
      required: false
      schema: { type: string, enum: ["0"] }
      description: >
        start=0 stages the pull without beginning it, so a filesystem and a firmware update can be
        queued and then run as one session with a single reboot. The next request without this
        flag arms everything staged.
    persist:
      in: query
      name: persist
      required: false
      schema: { type: string, enum: ["0"] }
      description: persist=0 uses the URL for this session only, without writing it to NVS.
    reboot:
      in: query
      name: reboot
      required: false
      schema: { type: string, enum: ["0", "false", "no"] }
      description: >
        Any of these values defers the restart, so a client can push the filesystem and the
        firmware and reboot once at the end. Default is to reboot.

  responses:
    Ok:
      description: Saved
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusResponse"
          example:
            status: ok
    BadRequest:
      description: Empty body or invalid JSON
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: "Invalid JSON"
    Unauthorized:
      description: Missing or wrong credentials; a WWW-Authenticate challenge is returned
    RequestTimeout:
      description: The body took longer than 5 seconds to arrive; retry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: "Request body took too long, retry"
    Conflict:
      description: Another request holds the shared body buffer; retry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: "Another request is in progress, retry"
    PayloadTooLarge:
      description: Body larger than 2047 bytes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: "Request body too large"
    UnsupportedMediaType:
      description: Content-Type not accepted by this endpoint, or a multipart/* Content-Type header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: "Unsupported Content-Type for this endpoint"
    TooManyRequests:
      description: Locked out after 5 wrong passphrase attempts; lasts 5 minutes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: "Too many failed attempts. Try again later."
    NoPassphrase:
      description: The device has no passphrase configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: "No device_passphrase configured"
    PushOk:
      description: Image written
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PushResponse"
          example:
            status: ok
            target: firmware
            bytes: 1351024
            message: rebooting
    PushFailed:
      description: >
        No image received, OTA window closed, missing Content-Length, bad magic byte, or a flash
        write error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PushResponse"
          example:
            status: error
            target: firmware
            message: "OTA not enabled"
    PushBusy:
      description: Another push is in progress
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PushResponse"
          example:
            status: error
            target: firmware
            message: "another push in progress"
    CaptiveRedirect:
      description: Redirects to the setup page (the AP address while the setup AP is up, else "/")

  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    MessageResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: "Invalid JSON"

    PushResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        target:
          type: string
          enum: [firmware, filesystem]
        bytes:
          type: integer
        message:
          type: string
          description: '"rebooting" or "staged, awaiting reboot" on success, the error otherwise'
