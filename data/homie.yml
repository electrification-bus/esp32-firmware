# --- relay1: GPIO solid state relay, settable on/off ---
  - id: relay1
    name: Solid State Relay
    type: gpio
    properties:
      - id: pin
        name: GPIO Pin
        datatype: integer
        value: 9
        settable: false
        retained: false
        description: "GPIO pin number connected to the SSR control input"
      - id: state
        name: State
        datatype: "boolean"
        settable: true
        retained: true
        value: false
        description: "The state of the relay (on/off)."
