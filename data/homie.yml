homie: 5.0.1
name: ESP32POEISO
type: ebus
state: init
nodes:
  - id: relay1
    name: Solid State Relay
    type: gpio
    properties:
      - id: state
        name: State
        datatype: "boolean"
        settable: true
        retained: true
        value: false
        description: "The state of the relay (on/off)."
  - id: voltage_current_detector
    name: Modbus Eletechsup32
    type: modbus
    properties:
      - id: V_detect
        name: Voltage Detect
        datatype: boolean
        settable: false
        retained: true
        value: false
      - id: I_detect
        name: Current Detect
        datatype: boolean
        settable: false
        retained: true
        value: false
  - id: environment_bme280
    name: BME280 Temp/Pressure/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: °C
        settable: false
        retained: true
        value: 72.4
      - id: air_pressure
        name: Air Pressure
        datatype: float
        unit: mb
        settable: false
        retained: true
        value: 1024.4
      - id: relative_humidity
        name: Humidity
        datatype: float
        unit: percent
        settable: false
        retained: true
        value: 67.7
  - id: environment_sht20
    name: SHT20 MODBUS Temp/Humidity Sensor
    type: sensor
    properties:
      - id: temperature
        name: Temperature
        datatype: float
        unit: °C
        settable: false
        retained: true
        value: 77.7
      - id: relative_humidity
        name: Humidity
        datatype: float
        unit: percent
        settable: false
        retained: true
        value: 66.6
  - id: led
    name: LED
    type: switch
    properties:
      - id: on_off
        name: On/Off
        datatype: boolean
        settable: true
        retained: true
        value: false
  - id: meter_volts
    name: Voltage Sensor
    type: energy
    properties:
      - id: volts
        name: Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 120.0
  - id: meter_current
    name: Current Sensor
    type: energy
    properties:
      - id: amps
        name: Current
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 1.0
  - id: meter_watts
    name: Power Sensor
    type: energy
    properties:
      - id: watts
        name: Power
        datatype: float
        unit: W
        settable: false
        retained: true
        value: 0.0
  - id: meter_kwh
    name: Energy Consumption
    type: energy
    properties:
      - id: kwh
        name: Energy
        datatype: float
        unit: kWh
        settable: false
        retained: true
        value: 0.0
  - id: battery_bms
    name: JBD Smart BMS
    type: battery
    properties:
      - id: voltage
        name: Pack Voltage
        datatype: float
        unit: V
        settable: false
        retained: true
        value: 0.0
      - id: current
        name: Current
        datatype: float
        unit: A
        settable: false
        retained: true
        value: 0.0
      - id: soc
        name: State of Charge
        datatype: integer
        unit: "%"
        format: "0:100"
        settable: false
        retained: true
        value: 0
      - id: remain_capacity
        name: Remaining Capacity
        datatype: float
        unit: Ah
        settable: false
        retained: true
        value: 0.0
      - id: nominal_capacity
        name: Nominal Capacity
        datatype: float
        unit: Ah
        settable: false
        retained: true
        value: 0.0
      - id: cycles
        name: Charge Cycles
        datatype: integer
        settable: false
        retained: true
        value: 0
      - id: mosfet_status
        name: MOSFET Status
        datatype: string
        settable: false
        retained: true
        value: ""
        description: "CHG=ON/OFF,DSG=ON/OFF"
      - id: temperature
        name: Temperature
        datatype: float
        unit: °C
        settable: false
        retained: true
        value: 0.0
      - id: cell_voltages
        name: Cell Voltages
        datatype: string
        settable: false
        retained: true
        value: ""
        description: "Comma-separated cell voltages in V"
      - id: charge_control
        name: Charge Control
        datatype: boolean
        settable: true
        retained: true
        value: false
  - id: ota
    name: OTA Update
    type: ota
    properties:
      - id: enabled
        name: OTA Enabled
        datatype: boolean
        settable: true
        retained: true
        value: true
      - id: state
        name: Update State
        datatype: enum
        format: "idle,downloading,verifying,updating,rebooting,error"
        settable: false
        retained: true
        value: idle
      - id: progress
        name: Progress
        datatype: integer
        unit: "%"
        format: "0:100"
        settable: false
        retained: true
        value: 0
      - id: version
        name: Firmware Version
        datatype: string
        settable: false
        retained: true
        value: "1.0.0"
      - id: firmware-url
        name: Firmware URL
        datatype: string
        settable: true
        retained: false
        value: ""
      - id: checksum
        name: Firmware Checksum
        datatype: string
        settable: true
        retained: false
        value: ""
      - id: message
        name: Status Message
        datatype: string
        settable: false
        retained: true
        value: "Ready"
extensions: []
implementation: homie-esp32-sdk