<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homie Device Configuration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e; color: #e0e0e0; padding: 16px; max-width: 480px; margin: 0 auto;
    }
    h1 { color: #00d4ff; font-size: 1.4em; margin-bottom: 4px; }
    .topic { color: #888; font-size: 0.85em; margin-bottom: 20px; word-break: break-all; }
    h2 { color: #ccc; font-size: 1.1em; margin: 20px 0 10px; border-bottom: 1px solid #333; padding-bottom: 6px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.85em; color: #aaa; margin-bottom: 4px; }
    .field input {
      width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px;
      background: #16213e; color: #e0e0e0; font-size: 1em; outline: none;
    }
    .field input:focus { border-color: #00d4ff; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 1em;
      cursor: pointer; margin-top: 8px; transition: background 0.2s;
    }
    button:disabled { background: #333; color: #666; cursor: default; }
    button:enabled { background: #0077b6; color: #fff; }
    button:enabled:hover { background: #0096d6; }
    .status { font-size: 0.85em; margin-top: 6px; min-height: 1.2em; }
    .status.ok { color: #4caf50; }
    .status.err { color: #f44336; }
    .wifi-list { list-style: none; max-height: 260px; overflow-y: auto; }
    .wifi-item { display: flex; align-items: center; padding: 10px; border: 1px solid #333;
      border-radius: 6px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s; }
    .wifi-item:hover { border-color: #555; }
    .wifi-item.selected { border-color: #00d4ff; background: #16213e; }
    .wifi-item input[type=radio] { margin-right: 10px; accent-color: #00d4ff; }
    .wifi-ssid { flex: 1; font-size: 0.95em; }
    .wifi-lock { font-size: 0.8em; color: #aaa; margin-right: 8px; }
    .wifi-signal { font-size: 0.75em; color: #888; white-space: nowrap; }
    .wifi-pass-panel { display: none; margin-top: 10px; padding: 12px; background: #16213e;
      border: 1px solid #444; border-radius: 6px; }
    .wifi-pass-panel.visible { display: block; }
    .loading { color: #888; font-size: 0.9em; padding: 20px 0; text-align: center; }
    .pass-wrap { display: flex; align-items: center; }
    .pass-wrap input { flex: 1; border-radius: 6px 0 0 6px; }
    .pass-toggle { padding: 10px; background: #16213e; border: 1px solid #444; border-left: none;
      border-radius: 0 6px 6px 0; color: #aaa; cursor: pointer; font-size: 1.1em; line-height: 1; }
    .wifi-current { display: none; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px;
      background: #0a2a1a; border: 1px solid #1b5e20; font-size: 0.9em; }
    .wifi-current .ssid { color: #4caf50; font-weight: bold; }
    .wifi-current .ip { color: #aaa; font-size: 0.85em; margin-left: 8px; }
    .mqtt-status-banner { display: none; padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.9em; }
    .mqtt-status-banner.connected { background: #0a2a1a; border: 1px solid #1b5e20; display: block; }
    .mqtt-status-banner.failed { background: #2a0a0a; border: 1px solid #5e2020; display: block; }
    .mqtt-status-banner.none { background: #1a1a1a; border: 1px solid #444; display: block; }
    .mqtt-status-banner.broker { font-weight: bold; }
    .mqtt-status-banner.connected .broker { color: #4caf50; }
    .mqtt-status-banner.failed .broker { color: #f44336; }
  </style>
</head>
<body>
  <h1 id="dev-name">Homie Device</h1>
  <div class="topic" id="dev-topic"></div>

  <h2>Join Network</h2>
  <div class="wifi-current" id="wifi-current">Connected to <span class="ssid" id="wifi-current-ssid"></span><span class="ip" id="wifi-current-ip"></span></div>
  <div class="status" id="wifi-status"></div>
  <div id="wifi-loading" class="loading">Scanning for networks...</div>
  <ul id="wifi-list" class="wifi-list"></ul>
  <button type="button" id="wifi-join" disabled>Join Network</button>
  <div id="wifi-pass-panel" class="wifi-pass-panel">
    <div class="field"><label>Password</label><div class="pass-wrap"><input type="password" id="wifi-pass" placeholder="Network password"><span class="pass-toggle" id="wifi-pass-toggle">&#x1f441;</span></div></div>
    <button type="button" id="wifi-connect">Connect</button>
  </div>

  <h2>MQTT Configuration</h2>
  <div class="mqtt-status-banner" id="mqtt-banner"></div>
  <div class="field"><label>Broker</label><input type="text" id="broker" placeholder="mqtt.example.com"></div>
  <div class="field"><label>Username</label><input type="text" id="username" placeholder="(optional)"></div>
  <div class="field"><label>Password</label><input type="password" id="password" placeholder="(optional)"></div>
  <div class="field"><label>Port</label><select id="port" style="width:100%;padding:10px;border:1px solid #444;border-radius:6px;background:#16213e;color:#e0e0e0;font-size:1em"><option value="1883">1883 (MQTT)</option><option value="8883">8883 (MQTTS / TLS)</option></select></div>
  <button type="button" id="mqtt-save" disabled>Save MQTT</button>
  <div class="status" id="mqtt-status"></div>

  <h2>Firmware</h2>
  <div class="field"><label>Firmware Binary URL</label><input type="text" id="fw-url" placeholder="http://example.com/firmware.bin"></div>
  <button type="button" id="fw-save" disabled>Save Firmware URL</button>
  <div class="status" id="fw-status"></div>

  <h2>System</h2>
  <button type="button" id="btn-reset-prefs">Reset to YML Config Only</button>
  <div id="reset-confirm" class="wifi-pass-panel">
    <p style="margin-bottom:10px;font-size:0.9em;color:#f44336">Clear all portal-saved settings (WiFi + MQTT)?<br>Next boot will use only YML config.</p>
    <button type="button" id="reset-yes" style="width:48%;margin-right:4%;background:#c62828;color:#fff">Yes, Clear</button>
    <button type="button" id="reset-cancel" style="width:48%">Cancel</button>
  </div>
  <div class="status" id="reset-status"></div>
  <button type="button" id="btn-reboot" style="margin-top:8px">Reboot</button>
  <div id="reboot-confirm" class="wifi-pass-panel">
    <p style="margin-bottom:10px;font-size:0.9em;color:#f44336">Reboot the device now?</p>
    <button type="button" id="reboot-yes" style="width:48%;margin-right:4%;background:#c62828;color:#fff">Yes, Reboot</button>
    <button type="button" id="reboot-cancel" style="width:48%">Cancel</button>
  </div>
  <div class="status" id="reboot-status"></div>

  <script>
    (function() {
      var wifiList = document.getElementById('wifi-list');
      var wifiLoading = document.getElementById('wifi-loading');
      var wifiJoinBtn = document.getElementById('wifi-join');
      var wifiPassPanel = document.getElementById('wifi-pass-panel');
      var wifiPassInput = document.getElementById('wifi-pass');
      var wifiConnectBtn = document.getElementById('wifi-connect');
      var wifiStatus = document.getElementById('wifi-status');

      function signalLabel(rssi) {
        if (rssi >= -50) return 'Excellent';
        if (rssi >= -60) return 'Good';
        if (rssi >= -70) return 'Fair';
        return 'Weak';
      }

      var connectedSSID = '';

      function updateJoinBtn() {
        var sel = document.querySelector('input[name=wifi]:checked');
        wifiJoinBtn.disabled = !sel || sel.value === connectedSSID;
      }

      function renderNetworks(networks) {
        wifiLoading.style.display = 'none';
        wifiList.innerHTML = '';
        if (networks.length === 0) {
          wifiLoading.style.display = 'block';
          wifiLoading.textContent = 'No networks found';
          return;
        }
        // Find connected network index, default to first if not connected
        var selIdx = 0;
        if (connectedSSID) {
          for (var i = 0; i < networks.length; i++) {
            if (networks[i].ssid === connectedSSID) { selIdx = i; break; }
          }
        }
        for (var i = 0; i < networks.length; i++) {
          var n = networks[i];
          var isSel = (i === selIdx);
          var li = document.createElement('li');
          li.className = 'wifi-item' + (isSel ? ' selected' : '');
          li.innerHTML = '<input type="radio" name="wifi" value="' + n.ssid.replace(/"/g, '&quot;') + '"' +
            (isSel ? ' checked' : '') + '>' +
            '<span class="wifi-ssid">' + n.ssid.replace(/</g, '&lt;') + '</span>' +
            (n.secure ? '<span class="wifi-lock">&#x1f512;</span>' : '') +
            '<span class="wifi-signal">' + signalLabel(n.rssi) + ' (' + n.rssi + ')</span>';
          wifiList.appendChild(li);
        }
        updateJoinBtn();

        var items = wifiList.querySelectorAll('.wifi-item');
        for (var j = 0; j < items.length; j++) {
          items[j].addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') {
              this.querySelector('input[type=radio]').checked = true;
            }
            for (var k = 0; k < items.length; k++) { items[k].className = 'wifi-item'; }
            this.className = 'wifi-item selected';
            updateJoinBtn();
          });
        }
      }

      // Load device info
      fetch('/api/device-info')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          document.getElementById('dev-name').textContent = d.name;
          document.getElementById('dev-topic').textContent = d.topic;
        })
        .catch(function() {});

      // Load MQTT status banner
      var mqttBanner = document.getElementById('mqtt-banner');
      function updateMqttStatus() {
        fetch('/api/mqtt-status')
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d.status === 'connected') {
              mqttBanner.className = 'mqtt-status-banner connected';
              mqttBanner.innerHTML = 'Connected: <span class="broker">' + d.broker.replace(/</g, '&lt;') + ':' + d.port + '</span>';
            } else if (d.status === 'failed') {
              mqttBanner.className = 'mqtt-status-banner failed';
              mqttBanner.innerHTML = 'Failed: <span class="broker">' + d.broker.replace(/</g, '&lt;') + ':' + d.port + '</span>';
            } else {
              mqttBanner.className = 'mqtt-status-banner none';
              mqttBanner.textContent = 'No broker \u2013 not connected';
            }
          })
          .catch(function() {});
      }
      updateMqttStatus();

      // Check current WiFi STA connection, then load scan results
      var wifiCurrent = document.getElementById('wifi-current');
      function updateCurrentWifi() {
        fetch('/api/wifi-status')
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d.status === 'connected') {
              connectedSSID = d.ssid;
              document.getElementById('wifi-current-ssid').textContent = d.ssid;
              document.getElementById('wifi-current-ip').textContent = 'IP: ' + d.ip;
              wifiCurrent.style.display = 'block';
            } else {
              connectedSSID = '';
              wifiCurrent.style.display = 'none';
            }
            updateJoinBtn();
          })
          .catch(function() {});
      }

      // Fetch wifi-status first so connectedSSID is set before rendering networks
      fetch('/api/wifi-status')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.status === 'connected') {
            connectedSSID = d.ssid;
            document.getElementById('wifi-current-ssid').textContent = d.ssid;
            document.getElementById('wifi-current-ip').textContent = 'IP: ' + d.ip;
            wifiCurrent.style.display = 'block';
          }
          return fetch('/api/wifi-scan');
        })
        .then(function(r) { return r.json(); })
        .then(function(data) { renderNetworks(data); })
        .catch(function() {
          wifiLoading.textContent = 'Failed to scan networks';
        });

      // Toggle password visibility
      document.getElementById('wifi-pass-toggle').addEventListener('click', function() {
        var t = wifiPassInput.type === 'password' ? 'text' : 'password';
        wifiPassInput.type = t;
      });

      // Reset WiFi UI so user can select a network and try again
      function resetWifiUI() {
        wifiJoinBtn.disabled = false;
        wifiConnectBtn.disabled = false;
        wifiPassPanel.className = 'wifi-pass-panel';
        wifiPassInput.value = '';
      }

      // Join Network button reveals password panel
      wifiJoinBtn.addEventListener('click', function() {
        wifiPassPanel.className = 'wifi-pass-panel visible';
        wifiPassInput.focus();
      });

      // Poll WiFi connection status until connected or failed
      function pollWifiStatus(attempts) {
        if (attempts <= 0) {
          wifiStatus.className = 'status err';
          wifiStatus.textContent = 'Connection timed out.';
          resetWifiUI();
          return;
        }
        setTimeout(function() {
          fetch('/api/wifi-status')
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (d.status === 'connected') {
                wifiStatus.className = 'status ok';
                wifiStatus.textContent = 'Connected! IP: ' + d.ip;
                wifiPassPanel.className = 'wifi-pass-panel';
                updateCurrentWifi();
              } else if (d.status === 'auth_fail' || d.status === 'failed' || d.status === 'no_ssid') {
                wifiStatus.className = 'status err';
                wifiStatus.textContent = d.message || 'Connection failed.';
                resetWifiUI();
              } else {
                wifiStatus.textContent = 'Connecting... (' + attempts + ')';
                pollWifiStatus(attempts - 1);
              }
            })
            .catch(function() { pollWifiStatus(attempts - 1); });
        }, 1000);
      }

      // Connect button sends WiFi credentials and polls for result
      wifiConnectBtn.addEventListener('click', function() {
        var selected = document.querySelector('input[name=wifi]:checked');
        if (!selected) return;
        wifiConnectBtn.disabled = true;
        wifiJoinBtn.disabled = true;
        wifiStatus.className = 'status';
        wifiStatus.textContent = 'Connecting...';
        var body = JSON.stringify({ ssid: selected.value, password: wifiPassInput.value });
        fetch('/api/wifi', { method: 'POST', headers: {'Content-Type':'application/json'}, body: body })
          .then(function(r) { return r.json(); })
          .then(function() { pollWifiStatus(20); })
          .catch(function(err) {
            wifiStatus.className = 'status err';
            wifiStatus.textContent = 'Error: ' + err.message;
            resetWifiUI();
          });
      });

      // Enable Save MQTT button only when broker field is non-empty
      var mqttSaveBtn = document.getElementById('mqtt-save');
      var brokerInput = document.getElementById('broker');
      var mqttInputs = [brokerInput, document.getElementById('username'), document.getElementById('password'), document.getElementById('port')];
      for (var m = 0; m < mqttInputs.length; m++) {
        mqttInputs[m].addEventListener('input', function() {
          mqttSaveBtn.disabled = !brokerInput.value.trim();
        });
        mqttInputs[m].addEventListener('change', function() {
          mqttSaveBtn.disabled = !brokerInput.value.trim();
        });
      }

      // Save MQTT button - click handler with fetch, same pattern as WiFi Connect
      document.getElementById('mqtt-save').addEventListener('click', function() {
        var btn = document.getElementById('mqtt-save');
        var status = document.getElementById('mqtt-status');
        btn.disabled = true;
        status.className = 'status';
        status.textContent = 'Saving...';
        var body = JSON.stringify({
          broker: document.getElementById('broker').value,
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
          port: parseInt(document.getElementById('port').value) || 1883
        });
        fetch('/api/mqtt', { method: 'POST', headers: {'Content-Type':'application/json'}, body: body })
          .then(function(r) { return r.json(); })
          .then(function() {
            status.className = 'status ok';
            status.textContent = 'Saved. Device will connect to broker.';
            setTimeout(updateMqttStatus, 3000);
          })
          .catch(function(err) {
            status.className = 'status err';
            status.textContent = 'Error: ' + err.message;
            btn.disabled = false;
          });
      });

      // Reset to YML Config - reveal confirmation panel
      var resetPanel = document.getElementById('reset-confirm');
      document.getElementById('btn-reset-prefs').addEventListener('click', function() {
        resetPanel.className = 'wifi-pass-panel visible';
        resetPanel.scrollIntoView({behavior:'smooth', block:'nearest'});
      });
      document.getElementById('reset-cancel').addEventListener('click', function() {
        resetPanel.className = 'wifi-pass-panel';
      });
      document.getElementById('reset-yes').addEventListener('click', function() {
        resetPanel.className = 'wifi-pass-panel';
        var status = document.getElementById('reset-status');
        status.className = 'status';
        status.textContent = 'Clearing...';
        fetch('/api/reset-prefs', { method: 'POST' })
          .then(function(r) { return r.json(); })
          .then(function(d) {
            status.className = 'status ok';
            status.textContent = d.message || 'Preferences cleared.';
          })
          .catch(function(err) {
            status.className = 'status err';
            status.textContent = 'Error: ' + err.message;
          });
      });

      // Reboot - reveal confirmation panel
      var rebootPanel = document.getElementById('reboot-confirm');
      document.getElementById('btn-reboot').addEventListener('click', function() {
        rebootPanel.className = 'wifi-pass-panel visible';
        rebootPanel.scrollIntoView({behavior:'smooth', block:'nearest'});
      });
      document.getElementById('reboot-cancel').addEventListener('click', function() {
        rebootPanel.className = 'wifi-pass-panel';
      });
      document.getElementById('reboot-yes').addEventListener('click', function() {
        rebootPanel.className = 'wifi-pass-panel';
        var status = document.getElementById('reboot-status');
        status.className = 'status';
        status.textContent = 'Rebooting...';
        fetch('/api/reboot', { method: 'POST' })
          .then(function() {
            status.className = 'status ok';
            status.textContent = 'Device is rebooting...';
          })
          .catch(function() {
            status.className = 'status ok';
            status.textContent = 'Device is rebooting...';
          });
      });

      // Enable Firmware URL button only when input changes
      var fwUrlInput = document.getElementById('fw-url');
      var fwSaveBtn = document.getElementById('fw-save');
      fwUrlInput.addEventListener('input', function() {
        fwSaveBtn.disabled = !fwUrlInput.value.trim();
      });

      // Save Firmware URL button - click handler with fetch
      fwSaveBtn.addEventListener('click', function() {
        var btn = document.getElementById('fw-save');
        var status = document.getElementById('fw-status');
        btn.disabled = true;
        status.className = 'status';
        status.textContent = 'Saving...';
        var body = JSON.stringify({ url: document.getElementById('fw-url').value });
        fetch('/api/firmware', { method: 'POST', headers: {'Content-Type':'application/json'}, body: body })
          .then(function(r) { return r.json(); })
          .then(function() {
            status.className = 'status ok';
            status.textContent = 'Firmware URL saved.';
            btn.disabled = false;
          })
          .catch(function(err) {
            status.className = 'status err';
            status.textContent = 'Error: ' + err.message;
            btn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
